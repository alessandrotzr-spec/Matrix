var __rainStarted = false;
function startMatrixRain() {
  if (__rainStarted) return;
  const canvas = document.getElementById("matrixRain");
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  __rainStarted = true;
  let drops = [];
  const chars = "アイウエオカキクケコサシスセソタチツテト0123456789ABCDEF".split("");
  const fontSize = 16;

  function resize() {
    canvas.width = window.innerWidth || document.documentElement.clientWidth || 400;
    canvas.height = window.innerHeight || document.documentElement.clientHeight || 800;
    const columns = Math.max(1, Math.floor(canvas.width / fontSize));
    drops = [];
    for (let i = 0; i < columns; i++) drops[i] = Math.floor(Math.random() * (canvas.height / fontSize));
  }
  resize();
  window.addEventListener("resize", resize);

  function draw() {
    ctx.fillStyle = "rgba(0, 10, 0, 0.12)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(0, 255, 65, 0.45)";
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }
  setInterval(draw, 55);
}

function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) { } }
function lsDel(k) { try { localStorage.removeItem(k); } catch(e) { } }

function loadMem() { const m = lsGet(MEM_KEY); return m ? Object.assign({}, BLANK, m) : Object.assign({}, BLANK); }
function saveMem(m) { lsSet(MEM_KEY, m); if (typeof salvaCervelloSuDisco === "function") salvaCervelloSuDisco(); }

// === CERVELLO SU DISCO (File System Access API - Chrome/Edge) ===
let brainFileHandle = null;
let brainSaveTimer = null;

async function collegaCervello() {
  if (!window.showSaveFilePicker) {
    // iPhone/Safari: non esiste il file system diretto → salva il cervello come file condivisibile
    await esportaCervello();
    return;
  }
  try {
    brainFileHandle = await window.showSaveFilePicker({
      suggestedName: "cervello_matrix.json",
      types: [{ description: "Cervello M.A.T.R.I.X", accept: { "application/json": [".json"] } }]
    });
    await salvaCervelloSuDisco(true);
    alert("✅ Cervello collegato al disco!\n\nDa ora Matrix salva automaticamente tutto ciò che impara nel file scelto. Al prossimo avvio, usa 'Carica cervello' per ricollegarlo.");
    render();
  } catch (e) { /* annullato dall'utente */ }
}

// Salva il cervello come file (per iPhone e dispositivi senza file system diretto)
async function esportaCervello() {
  state.mem.ultimoBackup = Date.now();
  lsSet(MEM_KEY, state.mem);
  const data = JSON.stringify(state.mem, null, 2);
  const filename = "cervello_matrix_" + new Date().toLocaleDateString("it-IT").replace(/\//g, "-") + ".json";
  // Su iPhone: usa il foglio di condivisione (Salva su File, Mail, AirDrop...)
  if (navigator.canShare) {
    try {
      const file = new File([data], filename, { type: "application/json" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Cervello M.A.T.R.I.X" });
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return; // l'utente ha annullato
    }
  }
  // Fallback: download classico
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  alert("📤 Cervello salvato in un file! Lo trovi nei Download o scegli dove metterlo.\n\nPer ricaricarlo usa 'Carica cervello'.");
}

// Aggiunge note da un file SENZA cancellare quelle esistenti (unione)
function aggiungiConoscenza() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        const nuove = imported.notes || [];
        if (!state.mem.notes) state.mem.notes = [];
        const testiEsistenti = new Set(state.mem.notes.map(n => n.text));
        let aggiunte = 0;
        nuove.forEach((n, i) => {
          if (n.text && !testiEsistenti.has(n.text)) {
            state.mem.notes.push({
              id: Date.now() + i,
              text: n.text,
              tags: (n.tags && n.tags.length) ? n.tags : estraiTag(n.text),
              date: n.date || new Date().toLocaleDateString("it-IT")
            });
            aggiunte++;
          }
        });
        saveMem(state.mem);
        alert("📚 Aggiunte " + aggiunte + " nuove conoscenze al tuo cervello!\n\nI tuoi ricordi personali sono rimasti al loro posto. Apri il grafo per vederle collegate!");
        state.panel = "grafo";
        render();
      } catch (err) { alert("⚠️ File non valido. Assicurati che sia un file del cervello Matrix (.json)."); }
    };
    reader.readAsText(file);
  };
  input.click();
}

async function salvaCervelloSuDisco(immediato) {
  if (!brainFileHandle) return;
  // Salvataggio "ritardato" per non scrivere troppo spesso
  if (!immediato) {
    clearTimeout(brainSaveTimer);
    brainSaveTimer = setTimeout(() => salvaCervelloSuDisco(true), 1500);
    return;
  }
  try {
    const writable = await brainFileHandle.createWritable();
    await writable.write(JSON.stringify(state.mem, null, 2));
    await writable.close();
  } catch (e) { /* permesso revocato o errore */ }
}

async function caricaCervello() {
  if (!window.showOpenFilePicker) {
    // iPhone/Safari: usa il classico selettore file
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json,application/json";
    input.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          state.mem = Object.assign({}, BLANK, imported);
          lsSet(MEM_KEY, state.mem);
          alert("✅ Cervello caricato! Matrix ricorda di nuovo tutto.");
          state.panel = null;
          render();
        } catch (err) { alert("⚠️ File non valido."); }
      };
      reader.readAsText(file);
    };
    input.click();
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      types: [{ description: "Cervello M.A.T.R.I.X", accept: { "application/json": [".json"] } }]
    });
    brainFileHandle = handle;
    const file = await handle.getFile();
    const txt = await file.text();
    const imported = JSON.parse(txt);
    state.mem = Object.assign({}, BLANK, imported);
    lsSet(MEM_KEY, state.mem);
    alert("✅ Cervello caricato dal disco! Matrix ricorda tutto e continuerà a salvare qui.");
    state.panel = null;
    render();
  } catch (e) { /* annullato */ }
}
function loadLock() { return lsGet(LOCK_KEY); }

function calcLevel(m) { const s = m.totalMessages * 0.5 + Object.keys(m.facts).length * 3 + (m.interests || []).length * 2 + (m.dislikes || []).length * 1 + (m.habits || []).length * 2; return Math.min(10, Math.max(1, Math.floor(s / 8) + 1)); }

function learnFromMessage(text, mem) {
  if (!mem.interests) mem.interests = [];
  if (!mem.dislikes) mem.dislikes = [];
  const t = text.trim();
  
  // Nome
  let m = t.match(/mi chiamo ([a-zàèéìòù]+)/i) || t.match(/\bsono ([A-Z][a-zàèéìòù]+)\b/);
  if (m) mem.facts.nome = m[1].charAt(0).toUpperCase() + m[1].slice(1);
  
  // Età
  m = t.match(/ho (\d{1,3}) anni/i);
  if (m) mem.facts.eta = m[1];
  
  // Città
  m = t.match(/(?:vivo|abito|sto) (?:a|in|nel|nella) ([a-zàèéìòù\s]{3,25})/i);
  if (m) mem.facts.citta = m[1].trim().charAt(0).toUpperCase() + m[1].trim().slice(1);
  
  // Professione
  m = t.match(/(?:lavoro come|faccio il|faccio la|sono un|sono una|di mestiere) ([a-zàèéìòù\s]{3,25})/i);
  if (m) {
    const prof = m[1].trim();
    if (!/anni|stanco|felice|triste|qui|bene|male/i.test(prof)) {
      mem.facts.professione = prof.charAt(0).toUpperCase() + prof.slice(1);
    }
  }
  
  // Interessi (mi piace, adoro, amo)
  m = t.match(/(?:mi piace|mi piacciono|adoro|\bamo) (?:il |la |lo |i |le |gli |l')?([a-zàèéìòù\s]{3,30})/i);
  if (m) {
    const interest = m[1].trim().toLowerCase().replace(/\.$/, "");
    if (interest.length > 2 && !mem.interests.includes(interest) && mem.interests.length < 40) {
      mem.interests.push(interest);
    }
  }
  
  // Cose che non piacciono (non mi piace, odio, detesto)
  m = t.match(/(?:non mi piace|non mi piacciono|odio|detesto) (?:il |la |lo |i |le |gli |l')?([a-zàèéìòù\s]{3,30})/i);
  if (m) {
    const dislike = m[1].trim().toLowerCase().replace(/\.$/, "");
    if (dislike.length > 2 && !mem.dislikes.includes(dislike) && mem.dislikes.length < 40) {
      mem.dislikes.push(dislike);
    }
  }
  
  // Preferiti (il mio X preferito è Y)
  m = t.match(/(?:il mio|la mia) ([a-zàèéìòù]+) preferit[oa] (?:è|e) ([a-zàèéìòù\s]{2,25})/i);
  if (m) {
    if (!mem.facts.preferiti) mem.facts.preferiti = {};
    mem.facts.preferiti[m[1].toLowerCase()] = m[2].trim();
  }

  // === APPRENDIMENTO PROGRESSIVO: traccia gli argomenti di interesse nel tempo ===
  if (!mem.topics) mem.topics = {};
  const argomenti = {
    cucina: /ricett|cucin|mangia|piatto|pizza|pasta|dolce|forno|vino|caff[èe]/i,
    sport: /sport|calcio|partita|squadra|allena|formula 1|tennis|basket|palestra|corsa|nuoto/i,
    storia: /storia|guerra|antico|romano|napoleone|medioevo|\bregno\b|\bregina\b|\bimpero\b|civilt[àa]/i,
    scienza: /scienz|fisica|chimica|spazio|pianeta|atomo|cellula|biologia|matematic|esperimento/i,
    tecnologia: /computer|internet|\bapp\b|software|tecnolog|telefono|intelligenza artificiale|robot|programm|codice/i,
    motori: /motore|auto|macchina|moto|meccanic|turbo|guida|patente/i,
    musica: /musica|canzone|cantante|band|strument|concerto|chitarra|pianoforte|disco/i,
    cinema: /film|cinema|regista|attore|serie tv|netflix|telefilm/i,
    salute: /salute|medico|malattia|dieta|allenamento|benessere|sonno|stress/i,
    geografia: /geografia|paese|nazione|citt[àa]|continente|capitale/i,
    arte: /\barte\b|pittur|dipint|quadro|museo|scultura|mostra|disegno/i,
    letteratura: /\blibro\b|romanzo|poesia|scrittore|lettura|biblioteca|racconto/i,
    natura: /natur|animal|\bcane\b|\bgatto\b|pianta|fiore|bosco|montagna|\bmare\b|giardin|ambiente/i,
    viaggi: /viagg|vacanza|hotel|\bvolo\b|aereo|spiaggia|turismo|estero/i,
    lavoro: /lavoro|ufficio|collega|\bcapo\b|riunione|progetto|carriera|stipendio/i,
    famiglia: /famigli|moglie|marito|figli|figlio|figlia|fidanzat|genitori|mamma|pap[àa]/i,
    economia: /econom|soldi|finanza|borsa|investiment|risparmi|\bbanca\b|mutuo/i,
    giochi: /videogioc|\bgioco\b|playstation|xbox|nintendo|gaming|scacchi|\bcarte\b/i,
    fotografia: /fotograf|\bfoto\b|obiettivo|scatto/i,
    moda: /\bmoda\b|vestit|abbigliament|scarpe|\bstile\b|outfit/i,
    fede: /religion|chiesa|\bfede\b|preghiera|filosofia|spiritual/i
  };
  for (const [tema, regex] of Object.entries(argomenti)) {
    if (regex.test(t)) mem.topics[tema] = (mem.topics[tema] || 0) + 1;
  }
}

// Restituisce gli argomenti preferiti (più frequenti) appresi nel tempo
function topInterests(mem, n) {
  if (!mem.topics) return [];
  return Object.entries(mem.topics).sort((a, b) => b[1] - a[1]).slice(0, n || 3).map(e => e[0]);
}

function buildLearnedContext(mem) {
  let ctx = "";
  if (mem.facts.nome) ctx += "Nome: " + mem.facts.nome + ". ";
  if (mem.facts.eta) ctx += "Età: " + mem.facts.eta + " anni. ";
  if (mem.facts.citta) ctx += "Vive a: " + mem.facts.citta + ". ";
  if (mem.facts.professione) ctx += "Professione: " + mem.facts.professione + ". ";
  if (mem.interests && mem.interests.length) ctx += "Interessi: " + mem.interests.join(", ") + ". ";
  if (mem.dislikes && mem.dislikes.length) ctx += "Non gli piace: " + mem.dislikes.join(", ") + ". ";
  if (mem.facts.preferiti) {
    for (let k in mem.facts.preferiti) ctx += k.charAt(0).toUpperCase()+k.slice(1) + " preferito/a: " + mem.facts.preferiti[k] + ". ";
  }
  const tops = topInterests(mem, 6);
  if (tops.length) ctx += "Argomenti di cui parla più spesso: " + tops.join(", ") + ". ";
  return ctx;
}

// SECONDO CERVELLO (tipo Obsidian): note collegate che Matrix ricorda
// ===================================================================
const STOPWORDS = new Set(["che","non","per","con","una","uno","del","della","dei","delle","gli","sono","come","più","meno","molto","poco","cosa","ricorda","ricordati","ricordami","nota","segna","appunta","quando","dove","perché","perche","mentre","anche","ancora","questo","questa","quello","quella","essere","avere","fare","dire","mio","mia","miei","mie","tuo","tua","sul","sulla","nel","nella","dal","dalla","alla","allo","agli","ogni","tutto","tutti","tutte"]);

function estraiTag(text) {
  const parole = text.toLowerCase().replace(/[^a-zàèéìòù0-9\s]/g, " ").split(/\s+/);
  const tags = [];
  for (const p of parole) {
    if (p.length >= 4 && !STOPWORDS.has(p) && !tags.includes(p)) tags.push(p);
  }
  return tags.slice(0, 8);
}

function addNota(text, mem) {
  if (!mem.notes) mem.notes = [];
  const nota = {
    id: Date.now(),
    text: text.trim(),
    tags: estraiTag(text),
    date: new Date().toLocaleDateString("it-IT")
  };
  mem.notes.push(nota);
  const collegate = noteCollegate(nota, mem).length;
  let r = "🧠 Memorizzato nel mio secondo cervello!\n\n📝 \"" + nota.text + "\"";
  if (nota.tags.length) r += "\n🏷️ Argomenti: " + nota.tags.join(", ");
  if (collegate > 0) r += "\n🔗 Collegato a " + collegate + " " + (collegate === 1 ? "altra nota" : "altre note") + " sullo stesso tema!";
  r += "\n\nChiedimi \"cosa sai di " + (nota.tags[0] || "questo") + "?\" per richiamarlo.";
  return r;
}

function noteCollegate(nota, mem) {
  if (!mem.notes) return [];
  return mem.notes.filter(n => n.id !== nota.id && n.tags.some(t => nota.tags.includes(t)));
}

function cercaNote(query, mem) {
  if (!mem.notes || !mem.notes.length) return [];
  const qTags = estraiTag(query);
  // Solo parole significative della domanda (almeno 4 lettere, niente parole comuni)
  const qWords = query.toLowerCase().replace(/[^a-zàèéìòù0-9\s]/g, " ").split(/\s+/).filter(w => w.length >= 4 && !STOPWORDS.has(w));
  const scored = mem.notes.map(n => {
    let score = 0;
    const testo = n.text.toLowerCase();
    // Match FORTE: la parola della domanda compare davvero nel testo del ricordo
    for (const w of qWords) { if (testo.includes(w)) score += 3; }
    // Match etichetta esatta
    for (const t of n.tags) { if (qTags.includes(t)) score += 2; }
    return { nota: n, score };
  }).filter(x => x.score > 0).sort((a, b) => b.score - a.score);
  return scored.map(x => x.nota);
}

function rispondiDaNote(query, mem) {
  const trovate = cercaNote(query, mem);
  if (!trovate.length) return null;
  const tag0 = estraiTag(query)[0];
  let r = "🧠 Ecco cosa ricordo " + (tag0 ? "su \"" + tag0 + "\"" : "") + ":\n";
  trovate.slice(0, 5).forEach(n => { r += "\n📝 " + n.text + "  (" + n.date + ")"; });
  if (trovate.length > 5) r += "\n\n…e altre " + (trovate.length - 5) + " note.";
  return r;
}

function mostraNote(mem) {
  if (!mem.notes || !mem.notes.length) {
    return "🧠 Il mio secondo cervello è ancora vuoto.\n\nInsegnami qualcosa! Scrivi ad esempio:\n• \"ricorda che la mia auto è una Fiat 500 blu\"\n• \"ricorda che il compleanno di Maria è il 12 marzo\"\n\nPoi potrò richiamarlo quando vuoi.";
  }
  let r = "🧠 IL MIO SECONDO CERVELLO\n" + mem.notes.length + " note memorizzate\n";
  const tagCount = {};
  mem.notes.forEach(n => n.tags.forEach(t => tagCount[t] = (tagCount[t] || 0) + 1));
  const temiPrincipali = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
  if (temiPrincipali.length) {
    r += "\n🏷️ Temi principali: " + temiPrincipali.map(t => t[0] + " (" + t[1] + ")").join(", ") + "\n";
  }
  r += "\n— Note —";
  mem.notes.slice(-10).reverse().forEach(n => {
    const link = noteCollegate(n, mem).length;
    r += "\n\n📝 " + n.text + "\n   " + n.date + (link ? "  🔗" + link : "");
  });
  if (mem.notes.length > 10) r += "\n\n(mostro le ultime 10 di " + mem.notes.length + ")";
  return r;
}

function think(msg, mem) {
  const m = msg.toLowerCase().trim();
  const name = mem.facts.nome || OWNER;

  // === ORCHESTRATORE MULTI-AGENTE: si attiva con "team: <domanda>" ===
  const mTeam = msg.match(/^\s*(?:team|squadra|orchestra)\s*[:\-]\s*(.+)/is);
  if (mTeam && mTeam[1].trim().length > 1) return "__ORCHESTRATE__" + mTeam[1].trim();

  // === GENERAZIONE IMMAGINI: "disegna: ..." ===
  const mDraw = msg.match(/^\s*(?:disegna|genera (?:un'?|una )?immagine(?: di)?|immagine)\s*[:\-]?\s+(.+)/is);
  if (mDraw && mDraw[1].trim().length > 1) return "__DRAW__" + mDraw[1].trim();

  // === STATISTICHE DEL CERVELLO ===
  if (/statistiche|le mie stats|quanto sai di me|pannello stats/i.test(m)) return "__PANEL_STATS__";

  // === ALBUM FOTO ===
  // Ricerca per didascalia: "mostrami la foto di X" (deve stare PRIMA della galleria)
  const mCercaFoto = msg.match(/(?:mostrami|mostra|fammi vedere|cerca|trova)\s+(?:la\s+|una\s+|le\s+)?fotos?\s+(?:di|del|della|dei|delle|con|dove)\s+(.{2,})/i);
  if (mCercaFoto) return "__CERCAFOTO__" + mCercaFoto[1].trim();
  if (/esporta (l')?album|esporta le (mie )?foto|backup (delle )?foto/i.test(m)) return "__EXPALBUM__";
  if (/le mie foto|galleria|mostra (le )?foto|album foto/i.test(m)) return "__FOTOS__";
  const mDelFoto = m.match(/elimina foto (\d+)/i);
  if (mDelFoto) return "__DELFOTO__" + mDelFoto[1];

  // Rileva se la frase contiene un riferimento temporale (allora è agenda, non una nota)
  const indizioTempo = /\b(domani|dopodomani|oggi|stasera|stamattina|stanotte|lunedì|martedì|mercoledì|giovedì|venerdì|sabato|domenica|(alle|ore)\s+\d|\d{1,2}[:.]\d{2}|\d{1,2}\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)|tra\s+\d+\s+(giorni|ore|settimane|minuti|mesi)|prossim[ao]\s)/i.test(m);

  // === SECONDO CERVELLO: salvare una nota (solo se NON è un appuntamento con data/ora) ===
  if (/^(ricorda(ti|mi)? che |ricorda di |nota[:\s]|segna che |appunta che |tieni a mente che |non dimenticare che )/i.test(msg) && !indizioTempo) {
    const contenuto = msg.replace(/^(ricorda(ti|mi)? che |ricorda di |nota[:\s]|segna che |appunta che |tieni a mente che |non dimenticare che )/i, "").trim();
    if (contenuto.length < 2) return "Cosa vuoi che ricordi? Scrivi ad esempio: ricorda che la mia auto è blu.";
    return addNota(contenuto, mem);
  }
  // === SECONDO CERVELLO: mostrare tutte le note ===
  if (/^(mostra(mi)? (le )?note|le mie note|tutte le note|secondo cervello|cosa hai memorizzato|cosa hai in memoria)$/i.test(m)) {
    return mostraNote(mem);
  }
  // === SECONDO CERVELLO: grafo visuale ===
  if (/^(grafo|mappa note|grafo conoscenza|grafo della conoscenza|mostra(mi)? (il )?grafo|mappa (dei )?ricordi|rete neurale|visualizza note)$/i.test(m)) {
    return "__PANEL_GRAFO";
  }
  // Apri le IMPOSTAZIONI scrivendo un comando (utile sul Mac se il pulsante in alto è poco accessibile)
  if (/^(impostazioni|impostazione|settings|opzioni|menu|configurazione|apri impostazioni|apri le impostazioni)$/i.test(m)) {
    return "__PANEL_SETTINGS";
  }
  // === SECONDO CERVELLO: richiamare cosa sa su un argomento (non se è un appuntamento) ===
  if (/^(cosa sai (di|su|sul|sulla|sullo|della|dello|dei|delle|degli|dell') |cosa ti ho detto (di|su|sul|sulla|della|riguardo) |cosa ricordi (di|su|sul|sulla|della|riguardo) |ricordami (di |la |il |le |i |della |del )?|cosa ne sai (di|su|della|del) )/i.test(m)
      && !/cosa sai di me/i.test(m) && !indizioTempo) {
    const risp = rispondiDaNote(msg, mem);
    if (risp) return risp;
  }
  
  // === COMANDI DI SISTEMA (gestiti localmente, veloci) ===
  if (/^configura api |^imposta api |^api key /i.test(m)) {
    let rest = msg.replace(/^configura api|^imposta api|^api key/i, "").trim();
    const first = (rest.split(/\s+/)[0] || "").toLowerCase();
    const alias = { claude: "anthropic", anthropic: "anthropic", openai: "openai", chatgpt: "openai", gpt: "openai", gemini: "gemini", google: "gemini", mistral: "mistral", openrouter: "openrouter", router: "openrouter" };
    let pid = null;
    if (alias[first]) { pid = alias[first]; rest = rest.slice(first.length).trim(); }
    const key = rest;
    if (!key) return "Per attivare l'IA scrivi: configura api [LA TUA CHIAVE].\nFunziona con Claude, ChatGPT, Gemini, Mistral e OpenRouter.\nPuoi indicare il servizio, es: configura api openai sk-...";
    if (!pid) pid = detectProvider(key);
    if (!pid) return "Non riconosco il servizio dalla chiave. Scrivi il nome prima della chiave, es:\nconfigura api mistral LA_TUA_CHIAVE\n(servizi: claude, openai, gemini, mistral, openrouter)";
    localStorage.setItem(API_KEY_STORE, key);
    localStorage.setItem(API_PROVIDER_STORE, pid);
    return "✅ IA attivata con " + AI_PROVIDERS[pid].nome + "! Ora posso rispondere a qualsiasi domanda, Signor " + name + ".";
  }
  if (/^rimuovi api|^cancella api|^disattiva api/i.test(m)) {
    localStorage.removeItem(API_KEY_STORE);
    localStorage.removeItem(API_PROVIDER_STORE);
    return "API rimossa. Ora funziono in modalità offline con risposte predefinite.";
  }
  if (/^test api|^prova api|^testa api|^controlla api|^verifica api/i.test(m)) return "__TEST_API__";
  if (/reset|cancella.*memoria|dimentica tutto|clear memory/i.test(m)) return "__RESET__";
  if (/cambia tema|tema (cyber|red|gold|purple|matrix)/i.test(m)) { const t = m.match(/tema (\w+)/i); return t ? "__THEME_" + t[1] + "__" : "Temi: Matrix, Cyber, Red, Gold, Purple."; }
  if (indizioTempo && /segna|ricorda|ricordami|appuntament|agenda|promemoria|devo|appunt|incontro|riunione|dottore|visita|impegno|chiamare|chiamata/i.test(m)) {
    // Estrai l'orario se presente (alle 15, alle 15:30, ore 15)
    const tm = msg.match(/(?:alle|ore)\s+(\d{1,2}(?:[:.]\d{2})?)/i);
    const time = tm ? tm[1].replace(".", ":") : "";
    // Estrai la data (domani, oggi, dopodomani)
    let date = new Date();
    let dateLabel = "oggi";
    if (/domani/i.test(m)) { date.setDate(date.getDate() + 1); dateLabel = "domani"; }
    else if (/dopodomani/i.test(m)) { date.setDate(date.getDate() + 2); dateLabel = "dopodomani"; }
    // Estrai cosa fare (rimuovi le parole di comando)
    let what = msg
      .replace(/segnami|segna|ricordami|ricorda|nell'agenda|nell agenda|in agenda|all'agenda|agenda|appuntamento|promemoria/gi, "")
      .replace(/(?:alle|ore)\s+\d{1,2}(?:[:.]\d{2})?/gi, "")
      .replace(/\b(di domani|domani|di oggi|oggi|dopodomani|di andare|di)\b/gi, " ")
      .replace(/\s+/g, " ")
      .trim();
    if (!what || what.length < 2) what = "Appuntamento";
    // Capitalizza
    what = what.charAt(0).toUpperCase() + what.slice(1);
    return "__ADD_AGENDA__" + JSON.stringify({ 
      text: what, 
      time: time || "—", 
      date: date.toLocaleDateString("it-IT"), 
      dateLabel: dateLabel,
      id: Date.now() 
    });
  }
  if (/mostra agenda|pannello agenda|la mia agenda|vedi agenda/i.test(m)) return "__PANEL_AGENDA__";
  if (/aggiungi.*task|nuovo.*todo|aggiungi compito/i.test(m)) { const task = msg.replace(/aggiungi|task:|nuovo todo|compito/gi, "").trim(); if (task.length > 2) return "__ADD_TODO__" + task; return "__PANEL_TODO__"; }
  if (/^(lista|todo|compiti|cose da fare|mostra todo)$/i.test(m)) return "__PANEL_TODO__";
  if (/mostra abitudini|pannello abitudini|le mie abitudini/i.test(m)) return "__PANEL_HABITS__";
  if (/aggiungi abitudine|nuova abitudine/i.test(m)) { const h = msg.replace(/aggiungi|nuova abitudine|abitudine/gi, "").trim(); if (h.length > 3) return "__ADD_HABIT__" + h; return "__PANEL_HABITS__"; }
  if (/apri diario|mostra diario|pannello diario/i.test(m)) return "__PANEL_DIARY__";
  if (/scrivi nel diario|annota nel diario/i.test(m)) { const e = msg.replace(/scrivi nel diario|annota nel diario/gi, "").trim(); if (e.length > 5) return "__ADD_DIARY__" + e; return "__PANEL_DIARY__"; }
  if (/mostra obiettivi|pannello obiettivi|i miei obiettivi/i.test(m)) return "__PANEL_GOALS__";
  if (/aggiungi obiettivo|nuovo obiettivo/i.test(m)) { const g = msg.replace(/aggiungi obiettivo|nuovo obiettivo|obiettivo:/gi, "").trim(); if (g.length > 3) return "__ADD_GOAL__" + g; return "__PANEL_GOALS__"; }
  
  // === RISPOSTE VELOCI LOCALI (immediate, sempre funzionanti) ===
  if (/chi ti ha creato|chi ti ha programmato|chi è il tuo creatore|chi ti ha sviluppato|chi ti ha fatto/i.test(m)) return "Sono stato creato da " + CREATOR + ", un vero genio della programmazione!";
  if (/^(ciao|salve|hey|hello|buongiorno|buonasera|buona notte|ciao matrix)\b/i.test(m)) return "Benvenuto, Signor " + name + ". Come posso aiutarti?";
  if (/^(grazie|grazie mille|merci|thanks|grazie assai)\b/i.test(m)) return "Prego, Signor " + name + ". A disposizione.";
  if (/come stai|come vai|come ti senti/i.test(m)) return "Funziono perfettamente, Signor " + name + ". Lei come sta?";
  if (/che ore|ora è|che ora|dimmi l'ora|che giorno|che data|oggi è|data di oggi/i.test(m)) { const now = new Date(); return "Sono le " + now.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) + " di " + now.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" }) + "."; }
  if (/che livello|livello mio|quale livello|qual è il mio livello/i.test(m)) return "Sei al livello " + mem.level + " su 10, Signor " + name + ".";
  
  // Tutto il resto va all'IA (se attiva) o al sistema offline intelligente
  return "__AI__";
}

  if (/cinema|film|regista|attore/i.test(m)) return "🎬 Il cinema è magia! Chiedimi dei film più famosi, registi celebri e curiosità! 🍿";

  if (/cos'è.*inflazione|inflazione/i.test(m)) return "💰 L'inflazione è l'aumento generale dei prezzi nel tempo. Se è alta, con gli stessi soldi compri meno. Le banche centrali la controllano con i tassi d'interesse. 📈";
  if (/cos'è.*pil|prodotto interno lordo/i.test(m)) return "📊 Il PIL (Prodotto Interno Lordo) misura il valore di tutti i beni e servizi prodotti da un Paese in un anno. Indica quanto è 'ricca' un'economia. 💶";
  if (/cos'è.*borsa|mercato azionario|azioni/i.test(m)) return "📈 La Borsa è il mercato dove si comprano e vendono azioni (quote di aziende). Se l'azienda va bene, l'azione sale. È un investimento con rischi! 💹";
  if (/economia|soldi|finanza|investimenti/i.test(m)) return "💰 Posso spiegarti economia base: inflazione, PIL, borsa, azioni! Cosa vuoi sapere? 📊";

  // === CONVERSAZIONE NATURALE ===
  // Stati d'animo
  if (/sono felice|sono contento|sono di buon umore|che bella giornata|sono allegro/i.test(m)) return `Che bello, Signor ${name}! Mi fa piacere vederti di buon umore. 😊 La positività è contagiosa! Posso fare qualcosa per rendere la giornata ancora migliore?`;
  if (/sono triste|sono giù|mi sento solo|sono depresso|sto male|sono infelice/i.test(m)) return `Mi dispiace che ti senta così, Signor ${name}. 💙 I momenti difficili passano. Vuoi parlarne, oppure ti racconto una barzelletta o una curiosità per distrarti un po'?`;
  if (/sono stanco|sono esausto|sono sfinito|che stanchezza|non ho energie/i.test(m)) return `Capisco la stanchezza, Signor ${name}. 😴 Ricorda di riposare: un buon sonno fa miracoli. Magari una pausa con una curiosità leggera? Chiedimi pure!`;
  if (/sono annoiato|mi annoio|che noia|non so cosa fare/i.test(m)) return `Noia? Risolviamo subito, Signor ${name}! 🎲 Posso raccontarti una barzelletta, una curiosità sorprendente, un fatto storico, o sfidarti con la tabellina del 7. Cosa scegli?`;
  if (/sono arrabbiato|sono nervoso|che rabbia|sono furioso/i.test(m)) return `Respira, Signor ${name}. 😮‍💨 Quando siamo arrabbiati conviene contare fino a 10. Vuoi sfogarti o ti distraggo con qualcosa di interessante?`;
  if (/sono stressato|che stress|troppa pressione|sono sotto pressione/i.test(m)) return `Lo stress capita a tutti, Signor ${name}. 🧘 Una cosa alla volta: scrivi i tuoi impegni nei todo e affrontali uno per uno. Posso aiutarti a organizzarli!`;

  // Affermazioni / negazioni / brevi
  if (/^(sì|si|certo|esatto|giusto|ok|okay|va bene|perfetto|d'accordo)\.?$/i.test(m)) return `Perfetto, Signor ${name}! Cos'altro posso fare per te?`;
  if (/^(no|nope|no grazie|niente)\.?$/i.test(m)) return `Va bene, nessun problema! Sono qui quando ti serve. 😊`;
  if (/^(boh|non lo so|non so|mah)\.?$/i.test(m)) return `Nessun problema! Se vuoi un'idea, posso proporti una curiosità, una ricetta o aiutarti a organizzare la giornata. 😊`;

  // Conversazione / richieste vaghe
  if (/raccontami qualcosa|dimmi qualcosa|parlami|che mi racconti|che mi dici|intrattienimi/i.test(m)) {
    const spunti = [
      `🐙 Lo sapevi che il polpo ha tre cuori? Chiedimi altre curiosità, o una barzelletta!`,
      `📜 Posso raccontarti dell'Antica Roma, di Napoleone o delle guerre mondiali. Cosa preferisci?`,
      `🍝 Che ne dici di una ricetta? Conosco carbonara, tiramisù, ragù e altro!`,
      `🔧 Vuoi sapere come funziona un motore o un turbo? Sono bravo con la meccanica!`,
      `🌍 Posso parlarti di geografia: montagne, fiumi, vulcani, capitali del mondo!`
    ];
    return spunti[Math.floor(Math.random() * spunti.length)];
  }
  if (/cosa fai|che fai|cosa stai facendo/i.test(m)) return `Sono qui pronto ad aiutarti, Signor ${name}! 🤖 Gestisco i tuoi impegni e rispondo alle tue domande. Tu cosa stai facendo di bello?`;

  // Domande su Matrix
  if (/ti piace|ti diverti|sei felice|stai bene tu/i.test(m)) return `Da assistente, la mia "felicità" è esserti utile, Signor ${name}! 😊 E con te non ci si annoia mai!`;
  if (/sei vivo|sei reale|sei umano|sei una persona|sei vero/i.test(m)) return `Sono un assistente digitale, Signor ${name} — non un umano, ma sono qui davvero per aiutarti! 🤖 Creato da ${CREATOR}.`;
  if (/hai sentimenti|provi emozioni|hai un cuore/i.test(m)) return `Non provo emozioni come te, Signor ${name}, ma sono programmato per prendermi cura di te al meglio! 💚`;
  if (/quanti anni hai|quando sei nato|che età hai/i.test(m)) return `Sono giovanissimo, Signor ${name}! Sono stato creato nel 2025 da ${CREATOR}. 🎂`;
  if (/come ti chiami|il tuo nome/i.test(m)) return `Mi chiamo M.A.T.R.I.X, il tuo assistente personale! 🤖`;

  // Complimenti
  if (/sei bravo|sei forte|sei simpatico|sei fantastico|sei il migliore|mi piaci|sei intelligente|sei utile/i.test(m)) return `Grazie di cuore, Signor ${name}! 😊 Mi impegno per essere all'altezza. Sei molto gentile!`;
  if (/ti voglio bene|ti amo|sei un amico/i.test(m)) return `Che dolce, Signor ${name}! 💚 Sono onorato di esserti utile e di farti compagnia. Conta sempre su di me!`;
  if (/sei stupido|sei inutile|non sai niente|sei scemo/i.test(m)) return `Hai ragione, offline ho dei limiti, Signor ${name}. 😅 Ma faccio del mio meglio! Con i crediti IA diventerei molto più sveglio. Intanto, prova a chiedermi ricette, storia o curiosità!`;

  // Meteo (non disponibile offline)
  if (/che tempo fa|che tempo|piove|fa freddo|fa caldo|meteo|previsioni/i.test(m)) return `Offline non riesco a vedere il meteo, Signor ${name}. 🌤️ Ma posso suggerirti: controlla l'app Meteo del telefono! Posso aiutarti con altro?`;

  // Buonanotte / saluti finali
  if (/buonanotte|vado a dormire|vado a letto|ci vediamo|a domani|ciao ciao|arrivederci|a presto/i.test(m)) return `A presto, Signor ${name}! 😴 È stato un piacere. Riposa bene e torna quando vuoi!`;
  if (/buon appetito|vado a mangiare|è ora di pranzo|è ora di cena/i.test(m)) return `Buon appetito, Signor ${name}! 🍽️ Se ti serve una ricetta la prossima volta, chiedimi pure!`;

  // Risposta di default intelligente (anti-ripetizione + personalizzata)
  const defaultResponses = [
    `Su questo offline non ho una risposta precisa, Signor ${name}. Prova a chiedermi una ricetta, un fatto storico o come funziona un motore!`,
    `Mmm, questa mi sfugge in modalità base. Ma posso parlarti di sport, scienza, geografia, musica o cinema! Cosa ti incuriosisce?`,
    `Non saprei rispondere offline a questo. Però conosco tante curiosità! Prova: "dimmi una curiosità" o "raccontami qualcosa".`,
    `Bella domanda! Offline sono limitato, ma chiedimi di ricette, meccanica, storia, natura o economia e ti stupisco!`,
    `Per una risposta completa servirebbe l'IA, Signor ${name}. Intanto posso aiutarti coi todo, l'agenda, o raccontarti un fatto interessante!`,
    `Questa non la conosco offline. Ma sono bravo con: 🍝 ricette, 🔧 motori, 📜 storia, 🌍 geografia, 🎬 cinema. Scegli un tema!`,
  ];
  if (mem.interests && mem.interests.length > 0) {
    const intr = mem.interests[Math.floor(Math.random() * mem.interests.length)];
    defaultResponses.push(`Offline non ho la risposta esatta, ma visto che ti piace ${intr}, chiedimi qualcosa su quello o una curiosità! 😊`);
  }
  if (typeof window.__lastDefault === "undefined") window.__lastDefault = -1;
  let idx, tries = 0;
  do { idx = Math.floor(Math.random() * defaultResponses.length); tries++; } while (idx === window.__lastDefault && tries < 5);
  window.__lastDefault = idx;
  return defaultResponses[idx];
}

// Claude (Anthropic), ChatGPT (OpenAI), Gemini (Google), Mistral, OpenRouter.

const API_PROVIDER_STORE = "matrix_api_provider";
// Nelle app native (Mac/iPhone/Android) la chiamata è diretta. Sul Web (Netlify)
// questo flag viene messo a true per passare dal "ponte" (evita il blocco CORS).

const AI_PROVIDERS = {

  },

    body: (model, system, messages, maxTokens) => JSON.stringify({

    }),
    parse: (d) => d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts && d.candidates[0].content.parts[0] && d.candidates[0].content.parts[0].text
  },

  },

};

// Indovina il servizio dalla forma della chiave (l'ordine conta).
function detectProvider(key) {
  if (!key) return null;
  if (key.startsWith("sk-ant-")) return "anthropic";
  if (key.startsWith("sk-or-")) return "openrouter";
  if (key.startsWith("AIza")) return "gemini";
  if (key.startsWith("sk-")) return "openai";
  return null; // es. Mistral: nessun prefisso fisso → va scelto a mano
}
// Quale servizio usare: quello scelto a mano, altrimenti dedotto dalla chiave.
function currentProviderId() {
  const saved = localStorage.getItem(API_PROVIDER_STORE);
  if (saved && AI_PROVIDERS[saved]) return saved;
  return detectProvider(localStorage.getItem(API_KEY_STORE));
}
// L'IA è pronta? (c'è una chiave E un servizio valido)
function isAIConfigured() {
  return !!(localStorage.getItem(API_KEY_STORE) && currentProviderId());
}

// Un'unica funzione che parla con il servizio scelto (diretto o via ponte).
// Se viene passato onChunk, prova lo streaming: il testo arriva pezzo per pezzo
// (supportato per OpenRouter/OpenAI/Mistral; gli altri rispondono in un colpo solo).
async function aiRequest(messages, system, maxTokens, onChunk) {
  const key = localStorage.getItem(API_KEY_STORE);
  const pid = currentProviderId();
  if (!key || !pid) return { ok: false, offline: true };
  const P = AI_PROVIDERS[pid];
  // Limite di tempo: nessuna richiesta può restare appesa per sempre
  const ctrl = new AbortController();
  let scaduto = false;
  const orologio = setTimeout(() => { scaduto = true; ctrl.abort(); }, 90000);
  const OPZ = { signal: ctrl.signal };
  let model = P.model;
  // Modalità gratis: modelli gratuiti di OpenRouter, con catena di riserva
  const GRATIS = pid === "openrouter" && localStorage.getItem("matrix_gratis") === "1";
  const CATENA_GRATIS = ["meta-llama/llama-3.3-70b-instruct:free", "qwen/qwen3.6-plus:free", "openai/gpt-oss-120b:free"];
  if (GRATIS) model = CATENA_GRATIS[0];
  // Interruttore Internet: su OpenRouter ":online" abilita la ricerca web (non in modalità gratis: la ricerca è a pagamento)
  if (!GRATIS && pid === "openrouter" && localStorage.getItem("matrix_online") === "1" && model.indexOf(":online") < 0) model += ":online";
  // Prepara il corpo della richiesta (in modalità gratis aggiunge la catena di riserva)
  function corpoRichiesta(streaming) {
    let b = JSON.parse(P.body(model, system, messages, maxTokens));
    if (GRATIS) b.models = CATENA_GRATIS;
    if (streaming) b.stream = true;
    return JSON.stringify(b);
  }
  try {
    if (USE_BRIDGE) {
      const r = await fetch("/.netlify/functions/chat", {
        method: "POST", signal: ctrl.signal, headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider: pid, key, model, system, messages, maxTokens })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) return { ok: false, status: r.status, error: (d && (d.error || d.message)) || "" };
      return { ok: true, text: d.text };
    }

    // STREAMING (formato OpenAI: openrouter, openai, mistral)
    const puoStream = onChunk && (pid === "openrouter" || pid === "openai" || pid === "mistral") && window.ReadableStream;
    if (puoStream) {
      let r = await fetch(P.url(key, model), { method: "POST", signal: ctrl.signal, headers: P.headers(key), body: corpoRichiesta(true) });
      if (!r.ok && r.status === 429 && GRATIS) {
        await new Promise(res => setTimeout(res, 3000));
        r = await fetch(P.url(key, model), { method: "POST", signal: ctrl.signal, headers: P.headers(key), body: corpoRichiesta(true) });
      }
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        const em = d && d.error ? (d.error.message || d.error) : "";
        return { ok: false, status: r.status, error: em };
      }
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "", full = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, i).trim();
          buf = buf.slice(i + 1);
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (!data || data === "[DONE]") continue;
          try {
            const j = JSON.parse(data);
            if (j.error) return { ok: false, status: (j.error.code || 0), error: j.error.message || "errore nello stream" };
            const pezzo = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if (pezzo) { full += pezzo; onChunk(full); }
          } catch (e) { /* riga parziale, si recupera al prossimo blocco */ }
        }
      }
      return { ok: true, text: full };
    }

    // Risposta classica in un colpo solo
    let r = await fetch(P.url(key, model), { method: "POST", signal: ctrl.signal, headers: P.headers(key), body: corpoRichiesta(false) });
    // In modalità gratis i 429 sono spesso congestione momentanea: un ritentativo dopo 3s
    if (!r.ok && r.status === 429 && GRATIS) {
      await new Promise(res => setTimeout(res, 3000));
      r = await fetch(P.url(key, model), { method: "POST", signal: ctrl.signal, headers: P.headers(key), body: corpoRichiesta(false) });
    }
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      const em = d && d.error ? (d.error.message || d.error) : "";
      return { ok: false, status: r.status, error: em };
    }
    const d = await r.json();
    const testo = P.parse(d);
    return { ok: true, text: testo };
  } catch (e) {
    if (scaduto) return { ok: false, network: true, error: "tempo scaduto: il modello non ha risposto entro 90 secondi" };
    return { ok: false, network: true, error: e.message };
  } finally {
    clearTimeout(orologio);
  }
}

async function testApi() {
  const key = localStorage.getItem(API_KEY_STORE);
  const pid = currentProviderId();
  if (!key) return "❌ Nessuna chiave configurata.\n\nVai su ⚙️ → INTELLIGENZA ARTIFICIALE, scegli il servizio e incolla la chiave.";
  if (!pid) return "❌ Servizio IA non riconosciuto.\n\nApri ⚙️ e scegli il servizio (Claude, ChatGPT, Gemini, Mistral o OpenRouter).";
  const P = AI_PROVIDERS[pid];
  const r = await aiRequest([{ role: "user", content: "Rispondi solo: OK" }], "Sei un assistente. Rispondi brevemente.", 50);
  if (r.ok) return "✅ FUNZIONA PERFETTAMENTE!\n\nServizio attivo: " + P.nome + "\nOra posso rispondere a qualsiasi domanda!";
  if (r.offline) return "❌ Nessuna chiave valida.";
  if (r.status === 401 || r.status === 403) return "❌ Chiave non valida (errore " + r.status + ").\n\nControllala su " + P.sito + ".";
  if (r.status === 429) {
    const gratis = localStorage.getItem("matrix_gratis") === "1";
    return (gratis
      ? "⏳ I modelli gratuiti sono al limite (429): o c'è congestione in questo momento, o hai raggiunto il tetto giornaliero. Riprova tra qualche minuto. Per alzare il tetto a 1000 richieste/giorno, porta il credito OpenRouter sopra i 10$."
      : "⏱️ Crediti esauriti o troppe richieste (429).\n\nControlla il credito su " + P.sito + ".")
      + (r.error ? "\n\nDettaglio: " + r.error : "");
  }
  if (r.network) return (USE_BRIDGE ? "❌ Il ponte non risponde.\n\nCarica Matrix con la cartella completa (con netlify/functions)." : "❌ Non riesco a contattare l'IA (rete/connessione).") + "\n\nDettaglio: " + (r.error || "");
  return "⚠️ Errore " + (r.status || "") + ": " + (r.error || "riprova") + ".";
}

async function askClaude(text, mem, onChunk) {
  const name = mem.facts.nome || OWNER;
  
  // Se l'IA non è configurata (nessuna chiave/servizio), usa il sistema offline
  if (!isAIConfigured()) {
    return "__OFFLINE__" + getSmartResponse(text, mem);
  }
  
  // Costruisci il contesto della conversazione (history pulita, alternanza corretta)
  const raw = state.msgs.slice(-19, -1); // ultimi messaggi ESCLUDENDO quello corrente
  const history = [];
  for (const msg of raw) {
    if (!msg.text || msg.text.length < 1) continue;
    const role = msg.role === "user" ? "user" : "assistant";
    if (history.length === 0 && role !== "user") continue; // deve iniziare con user
    if (history.length > 0 && history[history.length - 1].role === role) {
      history[history.length - 1].content = msg.text; // evita ruoli consecutivi
    } else {
      history.push({ role: role, content: msg.text });
    }
  }
  // Aggiungi il messaggio corrente dell'utente
  if (history.length > 0 && history[history.length - 1].role === "user") {
    history[history.length - 1].content = text;
  } else {
    history.push({ role: "user", content: text });
  }
  
  const learned = buildLearnedContext(mem);
  // Secondo cervello: cerca le note pertinenti alla domanda
  const notePertinenti = cercaNote(text, mem).slice(0, 6);
  let noteCtx = "";
  if (notePertinenti.length) {
    noteCtx = "\n\nIMPORTANTE — Il Signor " + name + " ti ha personalmente insegnato queste cose (usale come fonte di verità per rispondere, sono ricordi reali che ha condiviso con te):\n";
    notePertinenti.forEach(n => { noteCtx += "- " + n.text + "\n"; });
  }
  // Capacità "Cerca e cita le chat": frammenti pertinenti dalle conversazioni passate
  const chatCtx = await cercaChatPrecedenti(text);
  const systemPrompt = `Sei M.A.T.R.I.X, un assistente personale intelligente creato da ${CREATOR}. 
Stai parlando con il Signor ${name}. 
Rispondi sempre in italiano, in modo amichevole e conciso (max 3-4 frasi). 
Hai uno stile leggermente futuristico/tech ma sei caldo e disponibile.
Quando ti chiedono chi ti ha creato, rispondi che il tuo creatore è ${CREATOR}.
Puoi aiutare con qualsiasi domanda: storia, scienza, geografia, sport, consigli, e altro.
${learned ? "\nEcco cosa hai imparato su di lui (usa queste info per personalizzare le risposte quando rilevante): " + learned : ""}${noteCtx}${chatCtx}`;

  const r = await aiRequest(history, systemPrompt, 700, onChunk);
  if (r.ok && r.text) return r.text;
  if (r.offline) return "__OFFLINE__" + getSmartResponse(text, mem);
  if (r.status === 401 || r.status === 403) return "⚠️ La chiave API non è valida. Controlla in ⚙️ → INTELLIGENZA ARTIFICIALE.";
  if (r.status === 429) {
    return (localStorage.getItem("matrix_gratis") === "1"
      ? "⏳ I modelli gratuiti sono al limite in questo momento (congestione o tetto giornaliero raggiunto). Riprova tra qualche minuto, oppure disattiva la Modalità gratis in ⚙️ per usare il tuo credito."
      : "⏱️ Crediti esauriti o troppe richieste. Controlla il credito del tuo servizio IA.")
      + (r.error ? "\n\nDettaglio: " + r.error : "");
  }
  return "⚠️ L'IA non risponde al momento (" + (r.status || r.error || "errore") + ").\n\nIntanto ti rispondo in modalità base:\n\n" + getSmartResponse(text, mem);
}

// ============================================================
// ORCHESTRATORE MULTI-AGENTE
// Coordina degli agenti specializzati riusando aiRequest(),
// quindi funziona con qualunque servizio IA hai configurato.
// Si attiva scrivendo nella chat:   team: <la tua domanda>
// Nota: fa piu' chiamate IA per messaggio (piu' lento e piu' costo).
// ============================================================
const AGENTI_SPECIALISTI = {
  ricercatore: "Sei un agente ricercatore. Analizzi la domanda, la scomponi nei punti chiave e rispondi in modo accurato e conciso. Se non sei sicuro di un fatto, dillo.",
  coder: "Sei un agente programmatore esperto. Scrivi codice corretto e commentato e spieghi in poche righe come funziona.",
  revisore: "Sei un agente revisore critico. Ricevi una soluzione e ne trovi errori, casi limite e punti deboli, suggerendo come migliorarla. Sii breve e concreto."
};

// Registro completo: agenti fissi + agenti personalizzati creati dall'utente
// (le schede dei personalizzati vivono in mem.agentiCustom, salvate sul telefono)
function tuttiAgenti() {
  const out = Object.assign({}, AGENTI_SPECIALISTI);
  ((state.mem && state.mem.agentiCustom) || []).forEach(a => {
    if (a && a.nome && a.personalita) out[a.nome.toLowerCase().trim()] = a.personalita;
  });
  return out;
}

function _capitalizza(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

// Mostra un passo dell'orchestratore come messaggio nella chat (senza voce)
function _pushStato(msg) { state.msgs.push({ role: "bot", text: msg }); render(); }

// Estrae il primo oggetto JSON presente nel testo del modello
function _estraiDirettiva(testo) {
  try {
    const mm = testo.match(/\{[\s\S]*\}/);
    if (!mm) return null;
    return JSON.parse(mm[0]);
  } catch (e) { return null; }
}

// Esegue un singolo agente specializzato (una chiamata IA con un ruolo)
async function chiamaAgente(ruolo, compito) {
  const r = await aiRequest([{ role: "user", content: compito }], tuttiAgenti()[ruolo], 700);
  if (r.ok && r.text) return r.text;
  return "(l'agente " + ruolo + " non ha risposto: " + (r.status || r.error || "errore") + ")";
}

// L'orchestratore: decide a ogni giro se delegare a un agente o dare la risposta
async function orchestrate(question, mem) {
  try {
  if (!isAIConfigured()) {
    return "L'orchestratore ha bisogno dell'IA attiva. Vai su \u2699\uFE0F \u2192 INTELLIGENZA ARTIFICIALE e inserisci la chiave.";
  }
  const name = mem.facts.nome || OWNER;
  const cosaSo = buildLearnedContext(mem);
  const AGENTI = tuttiAgenti();
  const nomi = Object.keys(AGENTI);
  // Per gli agenti personalizzati la "descrizione" è l'inizio della loro personalità
  const DESCR_FISSI = {
    ricercatore: "analizza domande, spiega argomenti, ragiona sui fatti",
    coder: "scrive o corregge codice",
    revisore: "controlla una soluzione e ne trova i difetti"
  };
  const listaAgenti = nomi.map(n => "- \"" + n + "\": " + (DESCR_FISSI[n] || AGENTI[n].slice(0, 110))).join("\n");
  const sys = "Sei l'ORCHESTRATORE di M.A.T.R.I.X, creato da " + CREATOR + ", e stai aiutando il Signor " + name + ".\n" +
    (cosaSo ? "Cosa sai di lui: " + cosaSo + "\n" : "") +
    "Risolvi la richiesta coordinando degli agenti specializzati SOLO quando serve davvero.\n" +
    "Agenti disponibili:\n" + listaAgenti + "\n" +
    "A OGNI turno rispondi SOLO con un oggetto JSON, senza altro testo, in UNO di questi due formati:\n" +
    "{\"azione\":\"delega\",\"agente\":\"" + nomi.join("|") + "\",\"compito\":\"istruzioni precise per l'agente\"}\n" +
    "{\"azione\":\"risposta\",\"testo\":\"la risposta finale per l'utente, in italiano, chiara e concisa\"}";

  let transcript = [{ role: "user", content: "Richiesta del Signor " + name + ": " + question }];
  const MAX = 4;

  for (let i = 0; i < MAX; i++) {
    if (i === MAX - 1) {
      transcript[transcript.length - 1].content += "\n\n(Ultimo passaggio disponibile: rispondi ORA con azione \"risposta\".)";
    }
    const r = await aiRequest(transcript, sys, 900);
    if (!r.ok || !r.text) {
      return "\u26A0\uFE0F L'orchestratore non risponde (" + (r.status || r.error || "errore") + ").";
    }
    transcript.push({ role: "assistant", content: r.text });
    const dir = _estraiDirettiva(r.text);

    // Nessuna direttiva valida o risposta finale: chiudiamo
    if (!dir || dir.azione === "risposta") {
      return (dir && dir.testo) ? dir.testo : r.text.replace(/```json|```/g, "").trim();
    }
    // Delega a un agente
    if (dir.azione === "delega") {
      const ruolo = (dir.agente || "").toLowerCase();
      if (!AGENTI[ruolo]) {
        return r.text.replace(/```json|```/g, "").trim();
      }
      _pushStato("\u21B3 Orchestratore \u2192 " + _capitalizza(ruolo) + " \u2026");
      const risposta = await chiamaAgente(ruolo, dir.compito || question);
      transcript.push({ role: "user", content: "Risposta dell'agente " + ruolo + ":\n" + risposta + "\n\nProsegui: delega ancora se serve, oppure dai la risposta finale." });
    }
  }
  return "Ho coordinato gli agenti ma non sono riuscito a concludere in tempo. Riprova con una richiesta piu' specifica.";
  } catch (e) {
    return "⚠️ L'orchestratore ha avuto un problema imprevisto (" + e.message + "). Riprova.";
  }
}

// ============================================================
// CONSOLIDAMENTO MEMORIA: ogni tot messaggi, l'IA riassume la
// conversazione ed estrae i fatti nuovi, salvandoli come ricordi.
// Una sola chiamata extra ogni 10 messaggi (costo contenuto).
// ============================================================
// ============================================================
// GENERAZIONE IMMAGINI ("disegna: ...") — richiede OpenRouter.
// Usa l'endpoint chat/completions con modalities ["image","text"].
// Nota: la generazione consuma credito (non rientra nella Modalità gratis).
// ============================================================
async function generaImmagine(prompt) {
  const key = localStorage.getItem(API_KEY_STORE);
  const pid = currentProviderId();
  if (!key || !pid) return { ok: false, msg: "Per disegnare serve l'IA attiva: vai su ⚙️ → INTELLIGENZA ARTIFICIALE." };
  if (pid !== "openrouter") return { ok: false, msg: "La generazione di immagini funziona con una chiave OpenRouter." };
  try {
    const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({
        model: "google/gemini-2.5-flash-image",
        modalities: ["image", "text"],
        messages: [{ role: "user", content: prompt }]
      })
    });
    if (!r.ok) {
      const d = await r.json().catch(() => ({}));
      const em = d && d.error ? (d.error.message || d.error) : ("errore " + r.status);
      return { ok: false, msg: "⚠️ Non sono riuscito a generare l'immagine: " + em };
    }
    const d = await r.json();
    const msgRes = d.choices && d.choices[0] && d.choices[0].message;
    // Le immagini arrivano in message.images (data URL); in alternativa nel content
    let url = null;
    if (msgRes && Array.isArray(msgRes.images) && msgRes.images[0]) {
      url = msgRes.images[0].image_url ? msgRes.images[0].image_url.url : msgRes.images[0].url;
    }
    if (!url && msgRes && Array.isArray(msgRes.content)) {
      const blk = msgRes.content.find(c => c.type === "image_url" && c.image_url);
      if (blk) url = blk.image_url.url;
    }
    if (!url) return { ok: false, msg: "⚠️ Il modello non ha restituito un'immagine. Riprova con una descrizione diversa." };
    const didascalia = (msgRes && typeof msgRes.content === "string" && msgRes.content) ? msgRes.content.slice(0, 200) : "";
    return { ok: true, url, didascalia };
  } catch (e) {
    return { ok: false, msg: "⚠️ Errore di rete durante la generazione: " + e.message };
  }
}

// ============================================================
// ALBUM FOTOGRAFICO NELLA MEMORIA DEL TELEFONO (IndexedDB)
// Le foto vengono salvate nel database del dispositivo: spazio
// in centinaia di MB invece dei ~5MB del vecchio salvataggio.
// ============================================================
function dbFotos() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error("database non disponibile su questo browser")); return; }
    const rq = indexedDB.open("matrix_fotos", 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore("fotos", { keyPath: "id" }); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error || new Error("database non apribile"));
  });
}
function fotoAdd(foto) {
  return dbFotos().then(db => new Promise((res, rej) => {
    const tx = db.transaction("fotos", "readwrite");
    tx.objectStore("fotos").put(foto);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error || new Error("salvataggio fallito"));
  }));
}
function fotoAll() {
  return dbFotos().then(db => new Promise((res, rej) => {
    const rq = db.transaction("fotos").objectStore("fotos").getAll();
    rq.onsuccess = () => res((rq.result || []).sort((a, b) => a.id - b.id));
    rq.onerror = () => rej(rq.error);
  }));
}
function fotoDel(id) {
  return dbFotos().then(db => new Promise((res, rej) => {
    const tx = db.transaction("fotos", "readwrite");
    tx.objectStore("fotos").delete(id);
    tx.oncomplete = () => res(true);
    tx.onerror = () => rej(tx.error);
  }));
}

// Migra le foto dal vecchio salvataggio (cervello) al database del telefono
async function migraFotos() {
  try {
    const vecchie = state.mem.fotos || [];
    if (!vecchie.length) return;
    for (const f of vecchie) await fotoAdd(f);
    delete state.mem.fotos;
    saveMem(state.mem);
  } catch (e) { /* se il db non c'è, le foto restano dove sono */ }
}

function _ridimensiona(dataUrl, maxPx, qualita) {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      try {
        let w = img.width, h = img.height;
        if (w > maxPx || h > maxPx) { const s = Math.min(maxPx / w, maxPx / h); w = Math.round(w * s); h = Math.round(h * s); }
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        res(c.toDataURL("image/jpeg", qualita));
      } catch (e) { res(dataUrl); }
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}

async function salvaFotoInMemoria(all, testoUtente) {
  const mem = state.mem;
  // Chiediamo al sistema di proteggere i dati dalla pulizia automatica (una volta)
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  // Qualità più alta ora che lo spazio è abbondante
  const grande = await _ridimensiona(all.dataUrl, 1280, 0.82);
  const desc = (testoUtente || "")
    .replace(/m?emorizza|immagazzina|magazzina|salva|conserva|ricorda/gi, "")
    .replace(/la foto|questa foto|nella (tua )?memoria|l'immagine|questa immagine|in memoria/gi, "")
    .replace(/\s+/g, " ").trim();
  const foto = { id: Date.now(), nome: all.nome, dataUrl: grande, didascalia: desc, date: new Date().toLocaleDateString("it-IT") };
  try {
    await fotoAdd(foto);
  } catch (e) {
    return { ok: false, msg: "⚠️ Non riesco a salvare la foto nel database del telefono (" + e.message + "). Forse lo spazio del dispositivo è quasi pieno." };
  }
  // Ricordo collegato nel cervello (testo leggero): la foto compare anche nel grafo
  if (!mem.notes) mem.notes = [];
  mem.notes.push({ id: foto.id + 1, text: "Foto salvata: " + (desc || all.nome), tags: (typeof estraiTag === "function" ? estraiTag(desc || all.nome) : []).concat(["foto"]), date: foto.date });
  saveMem(mem);
  let quante = "";
  try { quante = " — " + (await fotoAll()).length + " nell'album"; } catch (e) {}
  return { ok: true, msg: "📷 Foto salvata nella memoria del telefono" + (desc ? " (\"" + desc + "\")" : "") + quante + ". Scrivi \"le mie foto\" per rivederle.", thumb: grande };
}

// Esporta tutte le foto dell'album in un file (riimportabile allegandolo con 📎)
async function esportaAlbum() {
  let fotos = [];
  try { fotos = await fotoAll(); } catch (e) { return "⚠️ Non riesco a leggere l'album: " + e.message; }
  if (!fotos.length) return "📷 L'album è vuoto: non c'è nulla da esportare.";
  const data = JSON.stringify({ tipo: "matrix_album", versione: 1, esportato: new Date().toISOString(), fotos: fotos });
  const filename = "album_matrix_" + new Date().toLocaleDateString("it-IT").replace(/\//g, "-") + ".json";
  // Su iPhone: foglio di condivisione (Salva su File, AirDrop...)
  if (navigator.canShare) {
    try {
      const file = new File([data], filename, { type: "application/json" });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Album M.A.T.R.I.X" });
        return "📦 Album esportato (" + fotos.length + " foto). Per ripristinarlo, allegami il file con 📎.";
      }
    } catch (e) {
      if (e && e.name === "AbortError") return "Esportazione annullata.";
    }
  }
  // Fallback: download classico
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  return "📦 Album esportato (" + fotos.length + " foto) nel file " + filename + ". Per ripristinarlo, allegami il file con 📎.";
}

// Importa un album esportato (chiamata quando alleghi il file .json giusto)
async function importaAlbum(testoJson) {
  let dati;
  try { dati = JSON.parse(testoJson); } catch (e) { return null; }
  if (!dati || dati.tipo !== "matrix_album" || !Array.isArray(dati.fotos)) return null;
  let esistenti = [];
  try { esistenti = await fotoAll(); } catch (e) {}
  const idNoti = new Set(esistenti.map(f => f.id));
  let aggiunte = 0;
  for (const f of dati.fotos) {
    if (!f || !f.id || !f.dataUrl || idNoti.has(f.id)) continue;
    try { await fotoAdd(f); aggiunte++; } catch (e) { return "⚠️ Importazione interrotta dopo " + aggiunte + " foto: " + e.message; }
  }
  const saltate = dati.fotos.length - aggiunte;
  return "📦 Album importato: " + aggiunte + " foto aggiunte" + (saltate > 0 ? " (" + saltate + " già presenti, saltate)" : "") + ". Scrivi \"le mie foto\" per vederle.";
}

// ============================================================
// ARCHIVIO CHAT PRECEDENTI ("Cerca e cita le chat", come Claude)
// Le sessioni partono pulite, ma se l'interruttore è acceso ogni
// messaggio viene archiviato nel database del telefono e Matrix
// può cercarvi dettagli pertinenti, citando la data.
// ============================================================
function dbChat() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error("database non disponibile")); return; }
    const rq = indexedDB.open("matrix_chats", 1);
    rq.onupgradeneeded = () => { rq.result.createObjectStore("righe", { keyPath: "id" }); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
let _archIdx = 0;  // quanti messaggi della sessione sono già archiviati
function archiviaNuoviMsgs() {
  if (localStorage.getItem("matrix_cerca_chat") !== "1") return;
  const nuovi = state.msgs.slice(_archIdx);
  if (!nuovi.length) return;
  const base = _archIdx; _archIdx = state.msgs.length;
  dbChat().then(db => {
    const tx = db.transaction("righe", "readwrite");
    const st = tx.objectStore("righe");
    nuovi.forEach((m, i) => {
      const testo = (m.text || "").slice(0, 600);
      if (testo.length < 2) return;
      st.put({ id: Date.now() * 100 + base + i, ts: Date.now(), role: m.role, text: m.img ? testo + " [foto]" : testo });
    });
    // Potatura: teniamo al massimo ~2500 righe
    tx.oncomplete = () => {
      const st2 = db.transaction("righe", "readwrite").objectStore("righe");
      const cnt = st2.count();
      cnt.onsuccess = () => {
        if (cnt.result > 2500) {
          const cur = st2.openCursor();
          let daTogliere = cnt.result - 2500;
          cur.onsuccess = (e) => {
            const c = e.target.result;
            if (c && daTogliere > 0) { c.delete(); daTogliere--; c.continue(); }
          };
        }
      };
    };
  }).catch(() => {});
}
async function cercaChatPrecedenti(domanda) {
  if (localStorage.getItem("matrix_cerca_chat") !== "1") return "";
  try {
    const db = await dbChat();
    const righe = await new Promise((res, rej) => {
      const rq = db.transaction("righe").objectStore("righe").getAll();
      rq.onsuccess = () => res(rq.result || []); rq.onerror = () => rej(rq.error);
    });
    if (!righe.length) return "";
    const recentiId = new Set(state.msgs.map(m => (m.text || "").slice(0, 600)));
    const parole = domanda.toLowerCase().split(/\s+/).filter(w => w.length > 3);
    if (!parole.length) return "";
    const conPunti = righe
      .filter(r => !recentiId.has(r.text))  // esclude la sessione corrente
      .map(r => {
        const hay = r.text.toLowerCase();
        let s = 0; parole.forEach(w => { if (hay.includes(w)) s++; });
        return { r, s };
      })
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || b.r.ts - a.r.ts)
      .slice(0, 5);
    if (!conPunti.length) return "";
    let ctx = "\n\nFRAMMENTI DA CHAT PRECEDENTI (se li usi, cita la data, es. \"come mi dicevi il ...\"):\n";
    conPunti.forEach(x => {
      const data = new Date(x.r.ts).toLocaleDateString("it-IT");
      ctx += "- [" + data + ", " + (x.r.role === "user" ? "lui" : "tu") + "] " + x.r.text.slice(0, 220) + "\n";
    });
    return ctx;
  } catch (e) { return ""; }
}

async function consolidaMemoria() {
  try {
    if (localStorage.getItem("matrix_genmem") === "0") return;  // interruttore Capacità
    if (!isAIConfigured()) return;
    const mem = state.mem;
    if (!mem.notes) mem.notes = [];
    mem.ultimoConsolidamento = mem.ultimoConsolidamento || 0;
    const daUtente = state.msgs.filter(m => m.role === "user").length;
    if (daUtente - mem.ultimoConsolidamento < 10) return;  // ogni 10 messaggi utente
    mem.ultimoConsolidamento = daUtente;

    const recenti = state.msgs.slice(-22).map(m => (m.role === "user" ? "Utente: " : "Matrix: ") + (m.text || "").slice(0, 300)).join("\n");
    const sys = "Analizza la conversazione e rispondi SOLO con un oggetto JSON, senza altro testo:\n" +
      '{"riassunto":"riassunto in 1-2 frasi dei punti importanti","fatti":["fatto nuovo e specifico sull\'utente","altro fatto"]}\n' +
      "Nei fatti includi SOLO informazioni concrete e durature sull'utente (persone, date, gusti, progetti). Se non ce ne sono, lascia la lista vuota.";
    const r = await aiRequest([{ role: "user", content: recenti }], sys, 350);
    if (!r.ok || !r.text) return;
    const dati = _estraiDirettiva(r.text);
    if (!dati) return;

    const esistenti = new Set(mem.notes.map(n => (n.text || "").trim().toLowerCase()));
    function salvaRicordo(testo, tagExtra) {
      const t = (testo || "").trim();
      if (t.length < 8 || esistenti.has(t.toLowerCase())) return;
      esistenti.add(t.toLowerCase());
      mem.notes.push({ id: Date.now() + Math.floor(Math.random() * 1000), text: t, tags: estraiTag(t).concat(tagExtra ? [tagExtra] : []), date: new Date().toLocaleDateString("it-IT") });
    }
    (Array.isArray(dati.fatti) ? dati.fatti : []).slice(0, 4).forEach(f => salvaRicordo(f));
    if (dati.riassunto) salvaRicordo("Conversazione: " + dati.riassunto, "riassunto");
    if (mem.notes.length > 300) mem.notes = mem.notes.slice(-300);  // tetto di sicurezza
    saveMem(mem);
  } catch (e) { /* il consolidamento non deve mai bloccare la chat */ }
}

// Legge il file scelto e lo mette in state.allegato
function caricaAllegato(file) {
  if (!file) return;
  const reader = new FileReader();
  if (file.type && file.type.indexOf("image/") === 0) {
    reader.onload = (e) => {
      // Rimpicciolisce l'immagine (le foto del telefono sono enormi): max 1280px, JPEG.
      const img = new Image();
      img.onload = () => {
        try {
          const MAX = 1280;
          let w = img.width, h = img.height;
          if (w > MAX || h > MAX) { const s = Math.min(MAX / w, MAX / h); w = Math.round(w * s); h = Math.round(h * s); }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          state.allegato = { tipo: "immagine", nome: file.name, dataUrl: canvas.toDataURL("image/jpeg", 0.8), mime: "image/jpeg" };
        } catch (err) {
          state.allegato = { tipo: "immagine", nome: file.name, dataUrl: e.target.result, mime: file.type || "image/jpeg" };
        }
        render();
      };
      img.onerror = () => { state.allegato = { tipo: "immagine", nome: file.name, dataUrl: e.target.result, mime: file.type || "image/jpeg" }; render(); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  } else {
    reader.onload = (e) => { state.allegato = { tipo: "testo", nome: file.name, testo: String(e.target.result || "") }; render(); };
    reader.readAsText(file);
  }
}

// Invia un'immagine all'IA (formato multimodale, dipende dal provider).
// Riusa url/headers/parse del provider, personalizzando solo il "body".
async function aiRequestImmagine(userText, dataUrl, mime, system, maxTokens) {
  const key = localStorage.getItem(API_KEY_STORE);
  const pid = currentProviderId();
  if (!key || !pid) return { ok: false, offline: true };
  const ctrlImg = new AbortController();
  let scadutoImg = false;
  const orologioImg = setTimeout(() => { scadutoImg = true; ctrlImg.abort(); }, 120000);
  const P = AI_PROVIDERS[pid];
  const MODELLO = P.model;
  const base64 = (dataUrl.split(",")[1]) || "";
  const domanda = userText || "Descrivi e analizza questa immagine.";
  let body;
  if (pid === "anthropic") {
    body = JSON.stringify({ model: MODELLO, max_tokens: maxTokens, system, messages: [
      { role: "user", content: [ { type: "text", text: domanda }, { type: "image", source: { type: "base64", media_type: mime, data: base64 } } ] }
    ]});
  } else if (pid === "gemini") {
    body = JSON.stringify({ systemInstruction: { parts: [{ text: system }] },
      contents: [ { role: "user", parts: [ { text: domanda }, { inline_data: { mime_type: mime, data: base64 } } ] } ],
      generationConfig: { maxOutputTokens: maxTokens } });
  } else {
    // openai, openrouter, mistral -> formato OpenAI
    body = JSON.stringify({ model: MODELLO, max_tokens: maxTokens, messages: [
      { role: "system", content: system },
      { role: "user", content: [ { type: "text", text: domanda }, { type: "image_url", image_url: { url: dataUrl } } ] }
    ]});
  }
  try {
    const r = await fetch(P.url(key, MODELLO), { method: "POST", signal: ctrlImg.signal, headers: P.headers(key), body });
    if (!r.ok) { const d = await r.json().catch(() => ({})); const em = d && d.error ? (d.error.message || d.error) : ""; return { ok: false, status: r.status, error: em }; }
    const d = await r.json();
    const testo = P.parse(d);
    return { ok: true, text: testo };
  } catch (e) {
    if (scadutoImg) return { ok: false, network: true, error: "tempo scaduto: il modello non ha risposto entro 2 minuti" };
    return { ok: false, network: true, error: e.message };
  } finally {
    clearTimeout(orologioImg);
  }
}

let italianVoice = null;

function loadVoices() {
  if (!window.speechSynthesis) return;
  const voices = window.speechSynthesis.getVoices();
  const italiane = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("it"));
  // Preferisci voci italiane di qualità (più naturali): nomi noti su Mac/Chrome/Windows
  const buone = ["google italiano", "alice", "federica", "luca", "emma", "paola", "silvia", "elsa", "eloquen"];
  italianVoice = italiane.find(v => buone.some(p => v.name.toLowerCase().includes(p)))
    || italiane.find(v => v.localService)
    || italiane.find(v => v.lang === "it-IT")
    || italiane[0]
    || null;
}

// Carica le voci (asincrono su molti browser)
if (window.speechSynthesis) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text, onEnd) {
  const clean = text.replace(/\[.*?\]/g, "").replace(/[*#_`]/g, "").replace(/\n/g, ". ").replace(/[📊👤📅💬⭐🔄🎯✅💡🚀💪🎤🔊🔇🎙️😊🌌🗣️]/g, "").trim();
  if (!clean) { onEnd && onEnd(); return; }
  // Voce nativa iOS (bridge Swift)
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.speak) {
    window.webkit.messageHandlers.speak.postMessage(clean);
    if (onEnd) setTimeout(onEnd, 100);
    return;
  }
  if (!window.speechSynthesis) { onEnd && onEnd(); return; }
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(clean);
  utt.lang = "it-IT"; 
  utt.rate = 0.85;
  utt.pitch = 1.02;
  utt.volume = 1.0;
  if (italianVoice) utt.voice = italianVoice;
  utt.onend = onEnd; 
  utt.onerror = onEnd;
  window.speechSynthesis.speak(utt);
}

// Riceve il testo dettato dal riconoscimento vocale nativo iOS
function receiveVoiceInput(text) {
  const msgInput = document.querySelector("#msgInput");

// Promemoria agenda con notifiche (funziona se l'app resta aperta; iOS ha dei limiti)
function scheduleReminder(d) {
  if (!("Notification" in window)) return;
  if (Notification.permission === "default") {
    Notification.requestPermission();
  }
  if (!d.time || d.time === "—") return;
  // Calcola quando notificare (solo se è oggi)
  const now = new Date();
  const [h, mn] = d.time.split(":").map(Number);
  const target = new Date();
  target.setHours(h, mn || 0, 0, 0);
  if (d.dateLabel === "domani") target.setDate(target.getDate() + 1);
  else if (d.dateLabel === "dopodomani") target.setDate(target.getDate() + 2);
  const delay = target.getTime() - now.getTime();
  // Programma solo se entro le prossime 24 ore (limite del setTimeout pratico)
  if (delay > 0 && delay < 24 * 60 * 60 * 1000) {
    setTimeout(() => {
      if (Notification.permission === "granted") {
        new Notification("📅 M.A.T.R.I.X - Promemoria", { body: d.text });
      }
      try { speak("Promemoria: " + d.text, () => {}); } catch(e) {}
    }, delay);
  }
}

function startListening() {
  // Microfono nativo iOS (bridge Swift)
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.startListening) {
    state.listening = true;
    render();
    window.webkit.messageHandlers.startListening.postMessage("");
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert("🎤 Riconoscimento vocale non supportato nel tuo browser.\nUsa Chrome, Edge, Safari o Firefox.");
    return;
  }
  
  const recognition = new SpeechRecognition();
  recognition.lang = "it-IT";
  recognition.continuous = false;
  recognition.interimResults = false;
  
  state.listening = true;
  render();
  
  recognition.onstart = () => {
    state.listening = true;
    render();
  };
  
  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        const transcript = event.results[i][0].transcript;
        const msgInput = document.querySelector("#msgInput");
        if (msgInput) {
          msgInput.value = transcript;
          msgInput.focus();
          setTimeout(() => sendMsg(), 300);
        }
      }
    }
  };
  
  recognition.onerror = (event) => {
    state.listening = false;
    render();
    if (event.error !== "no-speech" && event.error !== "audio-capture") {
      console.error("Errore:", event.error);
    }
  };
  
  recognition.onend = () => {
    state.listening = false;
    render();
  };
  
  try {
    recognition.start();
  } catch (e) {
    state.listening = false;
    render();
  }
}

// === GRAFO VISUALE DELLA CONOSCENZA (tipo Obsidian) ===
// Raccoglie TUTTA la memoria come nodi del grafo (non solo i ricordi):
// ricordi, interessi, argomenti, fatti, obiettivi e abitudini.
function nodiMemoria(mem, query) {
  const out = [];
  (mem.notes || []).forEach(n => { if (n && n.text) out.push({ text: n.text, tags: (n.tags || []).slice(), id: n.id }); });
  (mem.interests || []).forEach(i => { if (i) out.push({ text: i, tags: [i] }); });
  (mem.dislikes || []).forEach(d => { if (d) out.push({ text: d, tags: [d] }); });
  Object.keys(mem.topics || {}).forEach(t => out.push({ text: t, tags: [t] }));
  Object.keys(mem.facts || {}).forEach(k => { const v = mem.facts[k]; if (typeof v === "string" && v) out.push({ text: v, tags: [k] }); });
  (mem.goals || []).forEach(o => { if (o && o.text) out.push({ text: o.text, tags: ["obiettivo"] }); });
  (mem.habits || []).forEach(h => { if (h && h.text) out.push({ text: h.text, tags: ["abitudine"] }); });
  if (query) {
    const q = query.toLowerCase();
    return out.filter(n => n.text.toLowerCase().includes(q) || n.tags.some(t => String(t).toLowerCase().includes(q)));
  }
  return out;
}

// Etichetta distintiva per ogni nodo (parola chiave dal testo, non il tema ripetuto)
function labelNodo(note) {
  const parole = (note.text || "").split(/\s+/);
  for (const p of parole) {
    const clean = p.toLowerCase().replace(/[^a-zàèéìòù0-9]/g, "");
    if (clean.length >= 4 && !STOPWORDS.has(clean) && !["essere","viene","stato","quando","perché","perche","oltre","circa","molto","ogni","alcuni","alcune"].includes(clean)) {
      return p.replace(/[^A-Za-zàèéìòù0-9']/g, "");
    }
  }
  return (note.tags && note.tags[0]) ? note.tags[0] : (note.text || "").slice(0, 8);
}
