function areaDiNota(note) {
  const hay = ((note.tags || []).join(" ") + " " + (note.text || "")).toLowerCase();
  for (const a of AREE) { if (a.match.test(hay)) return a; }
  return AREA_DEFAULT;
}

function hexA(hex, a) {
  const h = hex.replace("#", "");
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function drawGraph(mem, g, ac, query) {
  const canvas = document.getElementById("graphCanvas");
  if (!canvas) return;
  if (graphAnim) { cancelAnimationFrame(graphAnim); graphAnim = null; }

  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext("2d");
  const W = rect.width, H = rect.height;
  const CX = W / 2, CY = H / 2;

  const notes = nodiMemoria(mem, query);
  if (query) { const el = document.getElementById("graphInfo"); if (el) el.innerHTML = notes.length ? ("\uD83D\uDD0D " + notes.length + " nodi trovati per \u201C" + query + "\u201D") : ("Nessun ricordo contiene \u201C" + query + "\u201D"); }
  if (!notes.length) { const ctx0 = canvas.getContext("2d"); ctx0.clearRect(0, 0, canvas.width, canvas.height); return; }

  // Aree presenti: ognuna diventa una "zona" del cervello con un centro nello spazio 3D
  const areeUniche = []; const areaIdx = {};
  notes.forEach(nt => { const a = areaDiNota(nt); if (!(a.nome in areaIdx)) { areaIdx[a.nome] = areeUniche.length; areeUniche.push(a); } });
  const nAree = Math.max(1, areeUniche.length);
  const Rsfera = Math.min(W, H) * 0.34 + 40;
  const centriArea = areeUniche.map((a, k) => {
    // distribuzione uniforme su una sfera (spirale di Fibonacci)
    const phi = Math.acos(1 - 2 * (k + 0.5) / nAree);
    const theta = Math.PI * (1 + Math.sqrt(5)) * (k + 0.5);
    return { x: Rsfera * Math.sin(phi) * Math.cos(theta), y: Rsfera * Math.sin(phi) * Math.sin(theta), z: Rsfera * Math.cos(phi), area: a, sx:0, sy:0, ss:1, depth:0 };
  });

  // Nodi in 3D: vicino al centro della loro zona (effetto cluster)
  const nodes = notes.map((note) => {
    const a = areaDiNota(note);
    const c = centriArea[areaIdx[a.nome]];
    const spread = 70;
    return { note, area: a, label: labelNodo(note), deg: 0,
      x: c.x + (Math.random()-0.5)*spread, y: c.y + (Math.random()-0.5)*spread, z: c.z + (Math.random()-0.5)*spread,
      hub: areaIdx[a.nome], sx:0, sy:0, ss:1, depth:0 };
  });

  // Collegamenti specifici (no categorie generiche)
  const AREE_TAG = new Set(["storia","scienza","musica","sport","geografia","natura","cucina","tecnologia","arte","cinema","economia","invenzioni","letteratura","corpo","animali","curiosita","ricetta","dolce","quadro","epoca","giochi"]);
  const freqTag = {};
  nodes.forEach(n => n.note.tags.forEach(t => { freqTag[t] = (freqTag[t]||0)+1; }));
  function tagCollega(t){ return !AREE_TAG.has(t) && freqTag[t] < 6; }
  const edges = [];
  for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
    const sh = nodes[i].note.tags.filter(t => nodes[j].note.tags.includes(t) && tagCollega(t));
    if (sh.length){ edges.push({a:i,b:j,label:sh[0]}); nodes[i].deg++; nodes[j].deg++; }
  }
  const vicini = nodes.map(()=>new Set());
  edges.forEach(e => { vicini[e.a].add(e.b); vicini[e.b].add(e.a); });

  // Vista 3D
  let rotY = 0.4, rotX = -0.25, zoom = 1, autoRot = true;
  let graphT = 0;        // tempo per gli impulsi luminosi sui collegamenti
  let pinchDist = 0;     // distanza tra le due dita (zoom pinch)
  let selected = null, selIdx = -1;
  let activeArea = null, worldNodes = [];
  let dragging = false, lastX = 0, lastY = 0, moved = false;

  // === ANIMAZIONI ===
  const KATAKANA = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789ABCDEF@#$%";
  const rainDrops = Array.from({length:32},(_,i)=>({
    x:(i/32)*W+Math.random()*30, y:Math.random()*H,
    speed:1.2+Math.random()*2.2,
    chars:[...KATAKANA].sort(()=>Math.random()-0.5).slice(0,6),
    ci:0, tick:0, opacity:0.06+Math.random()*0.1, size:10+Math.floor(Math.random()*4)
  }));
  let particles = [];
  let wavePos = W*2, waveCooldown = 180;
  let spark = {active:false,fromX:0,fromY:0,toX:0,toY:0,t:0,col:'#00ff41',life:0};
  let mouseX = CX, mouseY = CY;
  const FOV = 420;

  function raggio(nd){ return 4.5 + Math.min(9, nd.deg * 0.9); }

  // Stelle di sfondo
  const stelle = [];
  for (let i=0;i<60;i++) stelle.push({x:Math.random()*W, y:Math.random()*H, s:Math.random()*1.3+0.3, a:Math.random()*0.4+0.07});

  function proietta() {
    const cy = Math.cos(rotY), sy = Math.sin(rotY);
    const cx = Math.cos(rotX), sx = Math.sin(rotX);
    function proj(p){
      let x1 = p.x*cy - p.z*sy;
      let z1 = p.x*sy + p.z*cy;
      let y1 = p.y;
      let y2 = y1*cx - z1*sx;
      let z2 = y1*sx + z1*cx;
      const persp = FOV / (FOV + z2);
      p.sx = CX + x1*persp*zoom;
      p.sy = CY + y2*persp*zoom;
      p.ss = persp*zoom;
      p.depth = z2;
    }
    centriArea.forEach(proj);
    nodes.forEach(proj);
  }

  function alpha(nd, base){
    // piu' lontano = piu' trasparente
    const t = (nd.depth + Rsfera*1.6) / (Rsfera*3.2);
    return Math.max(0.12, Math.min(1, t)) * base;
  }

  function draw() {
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    stelle.forEach(s => { ctx.fillStyle = `rgba(${ac},${s.a})`; ctx.fillRect(s.x,s.y,s.s,s.s); });
    drawRain();
    tickWave();
    drawParticles();

    if(activeArea){ drawWorldMode(); return; }
    proietta();
    ctx.textAlign = "center";
    ctx.lineJoin = "round";

    // ── GRAFO PRINCIPALE: solo hub, nessun nodo individuale ──
    // Linee sottili tra hub vicini (connessioni estetiche)
    for(let i=0;i<centriArea.length;i++){
      for(let j=i+1;j<centriArea.length;j++){
        const a=centriArea[i], b=centriArea[j];
        const dx=a.sx-b.sx, dy=a.sy-b.sy;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<180){
          const op=0.18*(1-dist/180);
          ctx.strokeStyle=`rgba(${ac},${op})`;
          ctx.lineWidth=0.7;
          ctx.beginPath(); ctx.moveTo(a.sx,a.sy); ctx.lineTo(b.sx,b.sy); ctx.stroke();
        }
      }
    }

    // Impulsi che viaggiano tra hub (effetto neurale)
    centriArea.forEach((a,ai)=>{
      centriArea.forEach((b,bi)=>{
        if(bi<=ai) return;
        const dx=a.sx-b.sx, dy=a.sy-b.sy;
        if(Math.sqrt(dx*dx+dy*dy)<180){
          const pp=(graphT*0.2+ai*0.3+bi*0.17)%1;
          const px=a.sx+(b.sx-a.sx)*pp, py=a.sy+(b.sy-a.sy)*pp;
          ctx.fillStyle=hexA(a.area.colore,0.55);
          ctx.beginPath(); ctx.arc(px,py,1.4,0,Math.PI*2); ctx.fill();
        }
      });
    });

    // Orbite planetarie attorno agli hub
    drawOrbits();
    // Scintilla neurale (segue il mouse)
    trySparkFromMouse();
    updateSpark();

    // Hub come pianeti: cerchio + alone + nome area + conteggio nodi
    const ordineHub = centriArea.map((c,i)=>i).sort((A,B)=> centriArea[A].depth - centriArea[B].depth);
    ordineHub.forEach(i => {
      const c = centriArea[i];
      const col = c.area.colore;
      const cnt = nodes.filter(n=>n.hub===i).length;
      const r = Math.max(10, Math.min(22, 10 + cnt*0.05)) * Math.max(0.5, c.ss);

      // Alone esterno
      ctx.shadowBlur=22; ctx.shadowColor=hexA(col,0.7);
      ctx.beginPath(); ctx.arc(c.sx,c.sy,r+4,0,Math.PI*2);
      ctx.strokeStyle=hexA(col,0.25); ctx.lineWidth=3; ctx.stroke();
      ctx.shadowBlur=0;

      // Cerchio pieno
      ctx.shadowBlur=18; ctx.shadowColor=col;
      ctx.beginPath(); ctx.arc(c.sx,c.sy,r,0,Math.PI*2);
      ctx.fillStyle=hexA(col,0.22); ctx.fill();
      ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
      ctx.shadowBlur=0;

      // Nome area
      const dep=alpha(c,1);
      const wb=waveAlphaBoost(c.sx);
      ctx.fillStyle=hexA(col,Math.max(0.6,dep+wb));
      ctx.font=`bold ${Math.round(11*Math.max(0.7,c.ss))}px monospace`;
      ctx.fillText(c.area.nome.toUpperCase(), c.sx, c.sy-r-7);

      // Conteggio piccolo
      ctx.font=`${Math.round(9*Math.max(0.7,c.ss))}px monospace`;
      ctx.fillStyle=hexA(col,0.6);
      ctx.fillText(cnt+" ricordi", c.sx, c.sy+r+13);
    });
  }

  function loop(){
    if (!document.body.contains(canvas)){ graphAnim=null; return; }
    if (autoRot && !dragging) rotY += 0.0026;
    graphT += 0.016;
    draw();
    graphAnim = requestAnimationFrame(loop);
  }
  loop();

  function pos(e){
    const r = canvas.getBoundingClientRect();
    return { x:(e.touches?e.touches[0].clientX:e.clientX)-r.left, y:(e.touches?e.touches[0].clientY:e.clientY)-r.top };
  }
  function findNode(px,py){
    const arr=activeArea?worldNodes:nodes;
    let best=null, bestd=1e9;
    arr.forEach((nd,i)=>{ const r=(raggio(nd)+7)*Math.max(0.4,nd.ss); const dx=px-nd.sx, dy=py-nd.sy; const d=Math.sqrt(dx*dx+dy*dy); if(d<r && nd.depth<bestd){ bestd=nd.depth; best=i; } });
    return best;
  }
  function findHub(px,py){
    let best=null, bestd=1e9;
    centriArea.forEach((c,i)=>{ const r=20*Math.max(0.5,c.ss); const dx=px-c.sx, dy=py-c.sy; const d=Math.sqrt(dx*dx+dy*dy); if(d<r){ best=i; bestd=d; } });
    return best;
  }
  function resetInfo(){ const el=document.getElementById("graphInfo"); if(el) el.innerHTML="\uD83D\uDDB1\uFE0F Trascina per ruotare il cervello \u00b7 tocca un nodo per il ricordo"; }
  function layoutWorld(filtered) {
    const n = filtered.length;
    const base = Math.min(W, H);
    const zS = 90; // z-spread per effetto 3D
    if (n <= 20) {
      const R = base * 0.27;
      return filtered.map((nd, i) => Object.assign({}, nd, {
        x: R*Math.cos((i/n)*Math.PI*2-Math.PI/2),
        y: R*Math.sin((i/n)*Math.PI*2-Math.PI/2),
        z: (Math.random()-0.5)*zS,
        sx:0,sy:0,ss:1,depth:0
      }));
    } else if (n <= 60) {
      const n1=Math.round(n*0.38), n2=n-n1;
      const R1=base*0.17, R2=base*0.30;
      return filtered.map((nd, i) => {
        if(i<n1) return Object.assign({}, nd, { x:R1*Math.cos((i/n1)*Math.PI*2-Math.PI/2), y:R1*Math.sin((i/n1)*Math.PI*2-Math.PI/2), z:(Math.random()-0.5)*zS*0.6, sx:0,sy:0,ss:1,depth:0 });
        const j=i-n1;
        return Object.assign({}, nd, { x:R2*Math.cos((j/n2)*Math.PI*2-Math.PI/2), y:R2*Math.sin((j/n2)*Math.PI*2-Math.PI/2), z:(Math.random()-0.5)*zS, sx:0,sy:0,ss:1,depth:0 });
      });
    } else {
      const n1=Math.min(14,Math.round(n*0.18)), n2=Math.min(28,Math.round(n*0.32)), n3=n-n1-n2;
      const R1=base*0.13, R2=base*0.23, R3=base*0.34;
      return filtered.map((nd, i) => {
        const zv=(Math.random()-0.5)*zS*(i<n1?0.5:i<n1+n2?0.8:1.1);
        if(i<n1) return Object.assign({}, nd, { x:R1*Math.cos((i/n1)*Math.PI*2-Math.PI/2), y:R1*Math.sin((i/n1)*Math.PI*2-Math.PI/2), z:zv, sx:0,sy:0,ss:1,depth:0 });
        if(i<n1+n2){ const j=i-n1; return Object.assign({}, nd, { x:R2*Math.cos((j/n2)*Math.PI*2-Math.PI/2), y:R2*Math.sin((j/n2)*Math.PI*2-Math.PI/2), z:zv, sx:0,sy:0,ss:1,depth:0 }); }
        const j=i-n1-n2;
        return Object.assign({}, nd, { x:R3*Math.cos((j/n3)*Math.PI*2-Math.PI/2), y:R3*Math.sin((j/n3)*Math.PI*2-Math.PI/2), z:zv, sx:0,sy:0,ss:1,depth:0 });
      });
    }
  }


  // ─── PIOGGIA MATRIX ───
  function drawRain() {
    ctx.textAlign="center";
    rainDrops.forEach(d=>{
      d.tick++;
      if(d.tick%4===0){ d.ci=(d.ci+1)%d.chars.length; }
      ctx.font=d.size+"px monospace";
      ctx.fillStyle=`rgba(${ac},${d.opacity})`;
      ctx.fillText(d.chars[d.ci], d.x, d.y);
      // scia luminosa
      ctx.fillStyle=`rgba(${ac},${d.opacity*0.4})`;
      ctx.fillText(d.chars[(d.ci+1)%d.chars.length], d.x, d.y-d.size*1.4);
      d.y+=d.speed;
      if(d.y>H+20){ d.y=-20; d.x=Math.random()*W; }
    });
  }

  // ─── PARTICELLE ESPLOSIONE ───
  function spawnParticles(x,y,col,n=55){
    for(let i=0;i<n;i++){
      const angle=Math.random()*Math.PI*2;
      const speed=1.5+Math.random()*5;
      particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
        life:1,decay:0.015+Math.random()*0.025,size:1.5+Math.random()*4,col});
    }
  }
  function drawParticles(){
    particles=particles.filter(p=>p.life>0);
    particles.forEach(p=>{
      ctx.globalAlpha=p.life*p.life;
      ctx.shadowBlur=8; ctx.shadowColor=p.col;
      ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill();
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.93; p.vy*=0.93; p.life-=p.decay;
    });
    ctx.globalAlpha=1; ctx.shadowBlur=0;
  }

  // ─── ONDA DI COLORE ───
  function tickWave(){
    waveCooldown--;
    if(waveCooldown<=0){ wavePos=-150; waveCooldown=280+Math.floor(Math.random()*120); }
    if(wavePos<W+150) wavePos+=4;
  }
  function waveAlphaBoost(sx){
    const d=Math.abs(sx-wavePos);
    return d<70 ? (1-d/70)*0.7 : 0;
  }

  // ─── ANELLI ORBITANTI (pianeti) ───
  function drawOrbits(){
    centriArea.forEach((c,i)=>{
      const col=c.area.colore;
      const spd=0.007+i*0.0015;
      const ang=graphT*spd*(i%2===0?1:-1);
      const rO=(16+i*0.8)*Math.max(0.55,c.ss);
      const rOy=rO*0.38;
      // ellisse orbita
      ctx.strokeStyle=hexA(col,0.22); ctx.lineWidth=0.8;
      ctx.beginPath(); ctx.ellipse(c.sx,c.sy,rO,rOy,0,0,Math.PI*2); ctx.stroke();
      // luna
      const mx=c.sx+Math.cos(ang)*rO, my=c.sy+Math.sin(ang)*rOy;
      ctx.shadowBlur=10; ctx.shadowColor=col;
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(mx,my,2.2*Math.max(0.55,c.ss),0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    });
  }

  // ─── SCINTILLA NEURALE ───
  function updateSpark(){
    if(spark.active){
      spark.t+=0.045;
      const px=spark.fromX+(spark.toX-spark.fromX)*spark.t;
      const py=spark.fromY+(spark.toY-spark.fromY)*spark.t;
      // trail
      ctx.strokeStyle=hexA(spark.col,0.7*spark.life);
      ctx.lineWidth=1.8;
      ctx.shadowBlur=12; ctx.shadowColor=spark.col;
      ctx.beginPath();
      ctx.moveTo(spark.fromX+(spark.toX-spark.fromX)*Math.max(0,spark.t-0.35),
                 spark.fromY+(spark.toY-spark.fromY)*Math.max(0,spark.t-0.35));
      ctx.lineTo(px,py); ctx.stroke();
      // testa
      ctx.fillStyle=hexA(spark.col,spark.life);
      ctx.beginPath(); ctx.arc(px,py,3.5,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
      if(spark.t>=1){ spark.active=false; }
    }
  }
  function trySparkFromMouse(){
    if(spark.active) return;
    const arr=activeArea?worldNodes:nodes;
    // trova nodo più vicino al mouse
    let best=-1,bestD=60;
    arr.forEach((nd,i)=>{ const d=Math.hypot(nd.sx-mouseX,nd.sy-mouseY); if(d<bestD){bestD=d;best=i;} });
    if(best<0) return;
    const src=arr[best];
    // trova nodo vicino su schermo (escludendo se stesso)
    let t2=-1,tD=9999;
    arr.forEach((nd,i)=>{ if(i===best) return; const d=Math.hypot(nd.sx-src.sx,nd.sy-src.sy); if(d>25&&d<160&&d<tD){tD=d;t2=i;} });
    if(t2<0) return;
    const dst=arr[t2];
    spark={active:true,fromX:src.sx,fromY:src.sy,toX:dst.sx,toY:dst.sy,t:0,col:src.area.colore,life:1};
  }

  function enterWorld(area) {
    activeArea = area;
    const filtered = nodes.filter(n => n.area.nome === area.nome);
    const nf = filtered.length;
    worldNodes = layoutWorld(filtered);
    selected = null; selIdx = -1;
    spawnParticles(CX, CY, area.colore, 60);
    const el = document.getElementById("graphInfo");
    if (el) {
      el.innerHTML = `<span id="backFromWorld" style="cursor:pointer;color:rgba(${ac},0.75);text-decoration:underline;">← Grafo</span> &nbsp;›&nbsp; <span style="color:${area.colore};font-weight:bold;">${area.nome.toUpperCase()}</span> &nbsp;·&nbsp; ${nf} ricordi &nbsp;·&nbsp; tocca un nodo`;
      setTimeout(() => { const b=document.getElementById("backFromWorld"); if(b) b.onclick=()=>{ activeArea=null; worldNodes=[]; selected=null; selIdx=-1; resetInfo(); }; }, 30);
    }
  }

  function proiettaWorld() {
    const cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX);
    worldNodes.forEach(p=>{
      let x1=p.x*cy-p.z*sy, z1=p.x*sy+p.z*cy, y1=p.y, y2=y1*cx-z1*sx, z2=y1*sx+z1*cx;
      const persp=FOV/(FOV+z2);
      p.sx=CX+x1*persp*zoom; p.sy=CY+y2*persp*zoom; p.ss=persp*zoom; p.depth=z2;
    });
  }

  function drawWorldMode() {
    proiettaWorld();
    drawRain();
    tickWave();
    drawParticles();
    const col = activeArea.colore;
    const nw = worldNodes.length;
    const mostraLabel = nw <= 30;
    ctx.textAlign = "center";

    // Alpha basata sulla profondità (come nel grafo principale)
    const maxD = worldNodes.reduce((m,n)=>Math.max(m,Math.abs(n.depth)),1);
    function dAlpha(nd, base){ const t=(nd.depth+maxD*1.5)/(maxD*3); return Math.max(0.12,Math.min(1,t))*base; }

    // Painter's algorithm: dal più lontano al più vicino
    const ordine = worldNodes.map((_,i)=>i).sort((a,b)=>worldNodes[b].depth-worldNodes[a].depth);

    // Linee dal centro ai nodi
    ordine.forEach(i => {
      const nd=worldNodes[i];
      ctx.strokeStyle=hexA(col,dAlpha(nd,0.18)); ctx.lineWidth=0.6;
      ctx.beginPath(); ctx.moveTo(CX,CY); ctx.lineTo(nd.sx,nd.sy); ctx.stroke();
    });

    // Archi tra nodi connessi + impulsi luminosi
    if(nw<=80){
      for(let i=0;i<worldNodes.length;i++) for(let j=i+1;j<worldNodes.length;j++){
        const a=worldNodes[i],b=worldNodes[j];
        const attivo=(i===selIdx||j===selIdx);
        const sh=a.note.tags.filter(t=>b.note.tags.includes(t)&&tagCollega(t));
        if(sh.length){
          if(attivo){ctx.shadowBlur=8;ctx.shadowColor=col;ctx.strokeStyle=hexA(col,0.9);ctx.lineWidth=1.6;}
          else{ctx.shadowBlur=0;ctx.strokeStyle=selected?hexA(col,0.05):hexA(col,0.28);ctx.lineWidth=0.6;}
          ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();ctx.shadowBlur=0;
          // Impulso
          if(!selected||attivo){
            const pp=(graphT*0.3+i*0.2+j*0.13)%1;
            const px=a.sx+(b.sx-a.sx)*pp,py=a.sy+(b.sy-a.sy)*pp;
            if(attivo){ctx.shadowBlur=10;ctx.shadowColor=col;}
            ctx.fillStyle=hexA(col,attivo?0.95:0.55);
            ctx.beginPath();ctx.arc(px,py,attivo?2.5:1.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
          }
        }
      }
    }

    // Hub centrale con anello pulsante
    const pr=20+(Math.sin(graphT*2)+1)*5;
    ctx.strokeStyle=hexA(col,0.28+Math.sin(graphT*2)*0.12);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(CX,CY,pr,0,Math.PI*2);ctx.stroke();
    ctx.shadowBlur=28;ctx.shadowColor=col;
    ctx.beginPath();ctx.arc(CX,CY,17,0,Math.PI*2);
    ctx.fillStyle=hexA(col,0.35);ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle=col;ctx.font="bold 12px monospace";
    ctx.fillText(activeArea.nome.toUpperCase(),CX,CY-25);
    ctx.font="10px monospace";ctx.fillStyle=hexA(col,0.7);
    ctx.fillText(nw+" ricordi",CX,CY+31);

    // Nodi in ordine di profondità
    const rBase=nw>100?3:nw>50?4:nw>30?5:6;
    ordine.forEach(i=>{
      const nd=worldNodes[i];
      const isSel=i===selIdx;
      const r=rBase*Math.max(0.45,nd.ss);
      const al=dAlpha(nd,1);

      // Anello esterno per il selezionato
      if(isSel){
        ctx.shadowBlur=24;ctx.shadowColor=col;
        ctx.beginPath();ctx.arc(nd.sx,nd.sy,r+6,0,Math.PI*2);
        ctx.strokeStyle=hexA(col,0.55);ctx.lineWidth=1.5;ctx.stroke();
      }
      const wb2=waveAlphaBoost(nd.sx);
      ctx.beginPath();ctx.arc(nd.sx,nd.sy,r*(1+wb2*0.4),0,Math.PI*2);
      ctx.fillStyle=hexA(col,isSel?1:Math.min(1,al*0.88+wb2));ctx.fill();ctx.shadowBlur=0;

      if(isSel||mostraLabel){
        let lbl=labelNodo(nd.note);if(lbl.length>13)lbl=lbl.slice(0,12)+"\u2026";
        ctx.fillStyle=isSel?col:hexA(col,Math.max(0.45,al*0.9));
        ctx.font=(isSel?"bold ":"")+(isSel?"11":"10")+"px monospace";
        ctx.fillText(lbl,nd.sx,nd.sy-r-5);
      }
    });
  }



  function distTouches(e){ const a=e.touches[0], b=e.touches[1]; return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
  function onDown(e){
    if(e.touches && e.touches.length===2){ pinchDist=distTouches(e); dragging=false; moved=true; if(e.cancelable) e.preventDefault(); return; }
    dragging=true; const p=pos(e); lastX=p.x; lastY=p.y; moved=false;
  }
  function onMove(e){
    // aggiorna posizione mouse per la scintilla
    if(!e.touches){ const p2=pos(e); mouseX=p2.x; mouseY=p2.y; }
    if(e.touches && e.touches.length===2){
      const d=distTouches(e);
      if(pinchDist>0){ zoom *= d/pinchDist; zoom=Math.max(0.4,Math.min(4,zoom)); }
      pinchDist=d; moved=true;
      if(e.cancelable) e.preventDefault();
      return;
    }
    if(!dragging) return;
    const p=pos(e);
    const dx=p.x-lastX, dy=p.y-lastY;
    if(Math.abs(dx)+Math.abs(dy) > 2) moved=true;
    rotY += dx*0.008; rotX += dy*0.008;
    rotX = Math.max(-1.3, Math.min(1.3, rotX));
    lastX=p.x; lastY=p.y;
    if(e.cancelable) e.preventDefault();
  }
  function onUp(e){
    if(e.touches && e.touches.length>0){ pinchDist=0; dragging=false; return; }
    if(!moved){
      const p = pos(e.changedTouches?{clientX:e.changedTouches[0].clientX,clientY:e.changedTouches[0].clientY}:e);
      if(!activeArea){
        const hubHit = findHub(p.x,p.y);
        if(hubHit!=null){ enterWorld(centriArea[hubHit].area); return; }
      }
      const hit = findNode(p.x,p.y);
      const srcArr = activeArea ? worldNodes : nodes;
      if(hit!=null){ selected=srcArr[hit]; selIdx=hit; showNoteInfo(srcArr[hit], mem); }
      else if(!activeArea){ selected=null; selIdx=-1; resetInfo(); }
    }
    pinchDist=0; dragging=false;
  }
  canvas.onmousedown=onDown; canvas.onmousemove=onMove; canvas.onmouseup=onUp;
  canvas.onmouseleave=()=>{ dragging=false; };
  canvas.ontouchstart=onDown; canvas.ontouchmove=onMove; canvas.ontouchend=onUp;
  canvas.onwheel=(e)=>{ e.preventDefault(); zoom *= (e.deltaY<0?1.1:0.9); zoom=Math.max(0.4,Math.min(4,zoom)); };

  const zi=document.getElementById("gZoomIn"), zo=document.getElementById("gZoomOut"), zr=document.getElementById("gReset");
  if(zi) zi.onclick=()=>{ zoom=Math.min(4,zoom*1.2); };
  if(zo) zo.onclick=()=>{ zoom=Math.max(0.4,zoom*0.83); };
  if(zr) zr.onclick=()=>{ rotY=0.4; rotX=-0.25; zoom=1; selected=null; selIdx=-1; resetInfo(); };
}

function showNoteInfo(nd, mem) {
  const info = document.getElementById("graphInfo");
  if (!info) return;
  const link = noteCollegate(nd.note, mem).length;
  info.innerHTML = "\uD83D\uDCDD " + nd.note.text +
    (link ? "<br><span style='opacity:0.6;font-size:0.7rem;'>\uD83D\uDD17 " + link + " collegamenti</span>" : "") +
    (nd.note.id ? "<br><button id='delNote' style='margin-top:8px;background:rgba(255,80,80,0.15);border:1px solid rgba(255,80,80,0.5);color:#ff6464;padding:5px 12px;border-radius:5px;font-size:0.7rem;'>\uD83D\uDDD1\uFE0F Elimina questo ricordo</button>" : "");
  // Se il nodo è una foto, mostra la foto vera nel riquadro
  if ((nd.note.tags || []).includes("foto")) {
    fotoAll().then(fotos => {
      const f = fotos.find(x => (x.didascalia && nd.note.text.includes(x.didascalia)) || (x.nome && nd.note.text.includes(x.nome)));
      if (f && document.getElementById("graphInfo") === info) {
        const im = document.createElement("img");
        im.src = f.dataUrl;
        im.style.cssText = "display:block;max-width:100%;max-height:140px;border-radius:6px;margin-top:8px;border:1px solid rgba(232,232,232,0.4);";
        info.insertBefore(im, info.firstChild ? info.querySelector("#delNote") : null);
      }
    }).catch(() => {});
  }
  setTimeout(() => {
    const d = document.getElementById("delNote");
    if (d) d.onclick = () => {
      mem.notes = mem.notes.filter(x => x.id !== nd.note.id);
      saveMem(mem);
      state.panel = "grafo"; render();
    };
  }, 50);
}

      };
      input.click();
    };
    
    if (nameField) nameField.onchange = () => {
      mem.facts.nome = nameField.value.trim();
      saveMem(mem);
    };
    if (voiceToggle) voiceToggle.onclick = () => {
      state.voiceOn = !state.voiceOn;
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      render();
    };
    if (resetBtn) resetBtn.onclick = () => {
      if (confirm("Sicuro di voler cancellare tutta la memoria?")) {
        state.mem = Object.assign({}, BLANK);
        saveMem(state.mem);
        state.msgs = [];
        state.panel = null;
        render();
      }
    };
  }, 50);
  
  return div;
}

function renderAgendaPanel(mem, g, ac) { const div = document.createElement("div"); const sorted = (mem.agenda || []).slice().sort((a, b) => (a.time || "").localeCompare(b.time || "")); sorted.forEach(a => { const item = document.createElement("div"); item.style.cssText = `display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(${ac},0.08);`; const timeStr = (a.time && a.time !== "—") ? (" alle " + a.time) : ""; const dateStr = a.dateLabel || a.date; item.innerHTML = `<span style="font-size:1rem;">📅</span><div style="flex:1;"><div style="font-size:0.75rem;">${a.text}</div><div style="font-size:0.62rem;opacity:0.5;">${dateStr}${timeStr}</div></div><button style="color:rgba(255,80,80,0.6);font-size:1rem;">x</button>`; item.querySelector("button").onclick = () => { mem.agenda = mem.agenda.filter(x => x.id !== a.id); saveMem(mem); render(); }; div.appendChild(item); }); if (sorted.length === 0) div.innerHTML = `<div style="opacity:0.4;text-align:center;padding:20px;font-size:0.75rem;">Nessun appuntamento.</div>`; return div; }

async function sendMsg() {
  const text = document.querySelector("#msgInput").value.trim();
  if ((!text && !state.allegato) || state.busy) return;
  
  state.busy = true;
  document.querySelector("#msgInput").value = "";

  // --- ALLEGATO (immagine o file di testo) ---
  if (state.allegato) {
    const all = state.allegato;
    state.allegato = null;
    const etichetta = (all.tipo === "immagine" ? "\uD83D\uDDBC\uFE0F " : "\uD83D\uDCC4 ") + all.nome;
    state.msgs.push({ role: "user", text: (text ? text + "\n" : "") + "[" + etichetta + "]" });
    render();
    // Se chiedi di MEMORIZZARE la foto, la salviamo nell'album (niente chiamata IA)
    if (all.tipo === "immagine" && /m?emorizza|immagazzina|magazzina|salva|conserva|ricorda/i.test(text || "")) {
      const esito = await salvaFotoInMemoria(all, text);
      state.busy = false;
      if (esito.ok) { state.msgs.push({ role: "bot", text: esito.msg, img: esito.thumb }); render(); }
      else typeBotReply(esito.msg);
      return;
    }
    let risposta;
    if (!isAIConfigured()) {
      risposta = "Per leggere i file serve l'IA attiva. Vai su \u2699\uFE0F \u2192 INTELLIGENZA ARTIFICIALE.";
    } else if (all.tipo === "immagine") {
      const sys = "Sei M.A.T.R.I.X, l'assistente del Signor " + (state.mem.facts.nome || OWNER) + ". Rispondi in italiano, in modo chiaro e conciso.";
      const r = await aiRequestImmagine(text, all.dataUrl, all.mime, sys, 1000);
      risposta = (r.ok && r.text) ? r.text : ("\u26A0\uFE0F Non sono riuscito a leggere l'immagine (" + (r.status || r.error || "errore") + "). Controlla che il modello scelto supporti le immagini.");
    } else {
      // Se il file è un album M.A.T.R.I.X esportato, lo importiamo (niente chiamata IA)
      const importazione = await importaAlbum(all.testo || "");
      if (importazione) {
        state.busy = false;
        typeBotReply(importazione);
        return;
      }
      const contenuto = (all.testo || "").slice(0, 20000);
      const domanda = (text || "Leggi questo file e fammi un riassunto utile.") + "\n\n--- CONTENUTO DEL FILE " + all.nome + " ---\n" + contenuto;
      risposta = await askClaude(domanda, state.mem);
      if (risposta.indexOf("__OFFLINE__") === 0) risposta = risposta.replace("__OFFLINE__", "");
    }
    state.busy = false;
    typeBotReply(risposta);
    return;
  }
  // --- fine allegato ---
  
  let mem = state.mem;
  learnFromMessage(text, mem);
  mem.totalMessages++; mem.level = calcLevel(mem);
  
  let reply = think(text, mem);
  
  if (reply === "__RESET__") { state.mem = Object.assign({}, BLANK); saveMem(state.mem); state.msgs.push({ role: "user", text }, { role: "bot", text: "Memoria cancellata." }); state.busy = false; render(); return; }
  
  // Test dell'API
  if (reply === "__TEST_API__") {
    state.msgs.push({ role: "user", text });
    saveMem(state.mem);
    render();
    const result = await testApi();
    state.msgs.push({ role: "bot", text: result });
    state.busy = false;
    render();
    return;
  }
  if (reply.startsWith("__THEME_")) { const t = reply.replace("__THEME_", ""); if (THEMES[t]) state.mem.theme = t; reply = "Tema cambiato."; }
  if (reply.startsWith("__PANEL_")) { state.panel = reply.replace("__PANEL_", "").toLowerCase(); reply = ""; }
  if (reply.startsWith("__ADD_AGENDA__")) { const d = JSON.parse(reply.replace("__ADD_AGENDA__", "")); state.mem.agenda.push(d); state.panel = "agenda"; scheduleReminder(d); reply = `✅ Segnato in agenda: "${d.text}" per ${d.dateLabel || d.date}${d.time && d.time !== "—" ? " alle " + d.time : ""}, Signor ${state.mem.facts.nome || OWNER}.`; }
  if (reply.startsWith("__ADD_TODO__")) { const task = reply.replace("__ADD_TODO__", ""); state.mem.todos.push({ id: Date.now(), text: task, done: false }); state.panel = "todo"; reply = "Aggiunto."; }
  if (reply.startsWith("__ADD_HABIT__")) { const h = reply.replace("__ADD_HABIT__", ""); state.mem.habits.push({ id: Date.now(), text: h, streak: 0, lastDone: null }); state.panel = "habits"; reply = "Aggiunto."; }
  if (reply.startsWith("__ADD_DIARY__")) { const e = reply.replace("__ADD_DIARY__", ""); state.mem.diary.unshift({ id: Date.now(), text: e, date: new Date().toLocaleDateString("it-IT"), time: new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) }); state.panel = "diary"; reply = "Aggiunto."; }
  if (reply.startsWith("__ADD_GOAL__")) { const g = reply.replace("__ADD_GOAL__", ""); state.mem.goals.push({ id: Date.now(), text: g, done: false }); state.panel = "goals"; reply = "Aggiunto."; }
  
  // Album foto: cerca per didascalia ("mostrami la foto di X")
  if (reply.startsWith("__CERCAFOTO__")) {
    const query = reply.replace("__CERCAFOTO__", "");
    state.msgs.push({ role: "user", text });
    render();
    const fotos = await fotoAll().catch(() => []);
    state.busy = false;
    if (!fotos.length) { typeBotReply("📷 L'album è ancora vuoto. Allegami una foto con 📎 e scrivi \"memorizza questa foto\"."); return; }
    const parole = query.toLowerCase().split(/\s+/).filter(w => w.length > 2);
    const punteggio = f => {
      const hay = ((f.didascalia || "") + " " + (f.nome || "")).toLowerCase();
      let s = 0;
      parole.forEach(w => { if (hay.includes(w)) s++; });
      return s;
    };
    const trovate = fotos.map(f => ({ f, s: punteggio(f) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
    if (!trovate.length) {
      typeBotReply("📷 Non trovo foto che corrispondono a \"" + query + "\". Scrivi \"le mie foto\" per vedere tutto l'album con le didascalie.");
      return;
    }
    trovate.slice(0, 3).filter(x => x.s === trovate[0].s).forEach(x =>
      state.msgs.push({ role: "bot", text: "📷 " + (x.f.didascalia || x.f.nome) + " · " + x.f.date, img: x.f.dataUrl })
    );
    render();
    return;
  }

  // Album foto: esporta tutte le foto in un file
  if (reply === "__EXPALBUM__") {
    state.msgs.push({ role: "user", text });
    render();
    let esito;
    try { esito = await esportaAlbum(); } catch (e) { esito = "⚠️ Esportazione fallita: " + e.message; }
    state.busy = false;
    typeBotReply(esito);
    return;
  }

  // Album foto: mostra le foto salvate (dal database del telefono)
  if (reply === "__FOTOS__") {
    state.msgs.push({ role: "user", text });
    render();
    const fotos = await fotoAll().catch(() => []);
    state.busy = false;
    if (!fotos.length) { typeBotReply("📷 Non ho ancora foto in memoria. Allegane una con 📎 e scrivi \"memorizza questa foto\"."); return; }
    fotos.forEach((f, i) => state.msgs.push({ role: "bot", text: "📷 Foto " + (i + 1) + (f.didascalia ? " · " + f.didascalia : "") + " · " + f.date, img: f.dataUrl }));
    render();
    return;
  }
  if (reply.startsWith("__DELFOTO__")) {
    const n = parseInt(reply.replace("__DELFOTO__", ""), 10);
    state.msgs.push({ role: "user", text });
    const fotos = await fotoAll().catch(() => []);
    state.busy = false;
    if (n >= 1 && n <= fotos.length) {
      await fotoDel(fotos[n - 1].id).catch(() => {});
      typeBotReply("🗑️ Foto " + n + " eliminata. Restano " + (fotos.length - 1) + " foto nell'album.");
    } else {
      typeBotReply("Non trovo la foto numero " + n + ". Scrivi \"le mie foto\" per vedere i numeri.");
    }
    return;
  }

  // Generazione immagini ("disegna: ...")
  if (reply.startsWith("__DRAW__")) {
    const promptImg = reply.replace("__DRAW__", "");
    state.msgs.push({ role: "user", text });
    render();
    _pushStato("🎨 Sto disegnando… (ci vuole qualche secondo)");
    const ris = await generaImmagine(promptImg);
    state.busy = false;
    if (ris.ok) {
      state.msgs.push({ role: "bot", text: ris.didascalia || "Ecco l'immagine, Signor " + (state.mem.facts.nome || OWNER) + ". Tienila premuta per salvarla.", img: ris.url });
      render();
    } else {
      typeBotReply(ris.msg);
    }
    return;
  }

  // Orchestratore multi-agente (attivato con "team: ...")
  if (reply.startsWith("__ORCHESTRATE__")) {
    const q = reply.replace("__ORCHESTRATE__", "");
    state.msgs.push({ role: "user", text });
    saveMem(state.mem);
    render();
    _pushStato("Orchestratore attivato \u2014 coordino gli agenti specializzati\u2026");
    let risposta;
    try { risposta = await orchestrate(q, state.mem); }
    catch (e) { risposta = "⚠️ Errore imprevisto dell'orchestratore: " + e.message; }
    saveMem(state.mem);
    state.busy = false;
    typeBotReply(risposta);
    return;
  }

  // Risposta intelligente tramite IA
  if (reply === "__AI__") {
    // Mostra subito il messaggio utente e lo stato "sto pensando"
    state.msgs.push({ role: "user", text });
    saveMem(state.mem);
    render();
    
    // Chiama l'IA in streaming: il testo appare man mano che arriva
    let inStreaming = false;
    reply = await askClaude(text, mem, (parziale) => {
      if (!inStreaming) { inStreaming = true; state.msgs.push({ role: "bot", text: parziale }); render(); }
      state.msgs[state.msgs.length - 1].text = parziale;
      const bolle = document.querySelectorAll(".msg .txt");
      const ultima = bolle[bolle.length - 1];
      if (ultima) ultima.textContent = parziale;
      const area = document.getElementById("msgsArea");
      if (area) area.scrollTop = area.scrollHeight;
    });
    
    // Gestisci fallback offline
    if (reply.startsWith("__OFFLINE__")) {
      reply = reply.replace("__OFFLINE__", "");
    }
    
    saveMem(state.mem);
    state.busy = false;
    if (inStreaming) {
      // Lo streaming ha già mostrato il testo: finalizza e fai parlare la voce
      state.msgs[state.msgs.length - 1].text = reply;
      render();
      if (state.voiceOn && reply) { try { speak(reply, () => {}); } catch (e) {} }
    } else {
      typeBotReply(reply);
    }
    consolidaMemoria();  // in sottofondo: riassume ed estrae fatti ogni 10 messaggi
    return;
  }
  
  if (reply.startsWith("__OFFLINE__")) {
    reply = reply.replace("__OFFLINE__", "");
  }
  
  saveMem(state.mem);
  state.msgs.push({ role: "user", text });
  state.busy = false;
  typeBotReply(reply);
}

// Effetto scrittura graduale (typing) per le risposte
function typeBotReply(reply) {
  const idx = state.msgs.length;
  state.msgs.push({ role: "bot", text: reply });
  render();
  // La voce parte SUBITO (mentre il testo appare) per non perdere il contesto del tocco su iPhone
  if (state.voiceOn && reply) { try { speak(reply, () => {}); } catch(e) {} }
  const bubbles = document.querySelectorAll(".msg .txt");
  const last = bubbles[bubbles.length - 1];
  if (!last) return;
  last.textContent = "";
  let i = 0;
  const step = Math.max(1, Math.ceil(reply.length / 80));
  const timer = setInterval(() => {
    i += step;
    if (i >= reply.length) {
      last.textContent = reply;
      clearInterval(timer);
    } else {
      last.textContent = reply.substring(0, i);
    }
    const area = document.getElementById("msgsArea");
    if (area) area.scrollTop = area.scrollHeight;
  }, 25);
}

function checkPin() {
  const input = document.querySelector("#pinInput");
  if (input.value === PIN) {
    state.screen = "chat";
    state.pinInput = "";
    render();
  } else {
    state.pinAtt++;
    if (state.pinAtt >= 3) {
      state.pinLocked = true;
      state.pinSec = 60;
      const t = setInterval(() => { state.pinSec--; if (state.pinSec <= 0) { state.pinLocked = false; state.pinAtt = 0; clearInterval(t); } render(); }, 1000);
    }
    input.value = "";
    alert("PIN errato");
  }
}

let voiceUnlocked = false;
function unlockVoice() {
  if (voiceUnlocked || !window.speechSynthesis) return;
  voiceUnlocked = true;
  // Trucco per sbloccare la sintesi vocale su iOS/Safari
  const u = new SpeechSynthesisUtterance("");
  u.volume = 0;
  window.speechSynthesis.speak(u);
  loadVoices();
}

document.addEventListener("touchstart", unlockVoice, { once: true });
document.addEventListener("click", unlockVoice, { once: true });

window.addEventListener("load", () => {
  // Rimuovi eventuali note davvero duplicate (stesso testo)
  if (state.mem.notes && state.mem.notes.length) {
    const visti = new Set();
    state.mem.notes = state.mem.notes.filter(n => {
      const k = (n.text || "").trim().toLowerCase();
      if (!k || visti.has(k)) return false;
      visti.add(k);
      return true;
    });
    saveMem(state.mem);
  }
  const lock = loadLock();
  if (lock && lock.until > Date.now()) { state.pinLocked = true; state.pinSec = Math.ceil((lock.until - Date.now()) / 1000); const t = setInterval(() => { state.pinSec--; if (state.pinSec <= 0) { state.pinLocked = false; state.pinAtt = 0; saveLock(null); clearInterval(t); } render(); }, 1000); }

  // Promemoria backup: se sono passati 7+ giorni dall'ultimo salvataggio e il cervello ha contenuti
  const m = state.mem;
  const haDati = (m.notes && m.notes.length > 2) || (m.diary && m.diary.length > 2) || Object.keys(m.facts || {}).length > 1;
  const SETTE_GIORNI = 7 * 24 * 60 * 60 * 1000;
  if (haDati && (!m.ultimoBackup || Date.now() - m.ultimoBackup > SETTE_GIORNI)) {
    state.msgs.push({ role: "bot", text: "\uD83D\uDCBE Signor " + (m.facts.nome || OWNER) + ", \u00e8 da un po' che non salviamo il mio cervello. Se il browser pulisse i dati, perderemmo tutto: vada su \u2699\uFE0F e usi \"Esporta cervello\" per metterlo al sicuro." });
  }

  // === BRIEFING DEL GIORNO: agenda di oggi, todo aperti, abitudini da fare ===
  const oggi = new Date().toLocaleDateString("it-IT");
  const oggiStr = new Date().toDateString();
  if (m.ultimoBriefing !== oggi) {
    const righe = [];
    const eventiOggi = (m.agenda || []).filter(a => a.date === oggi);
    if (eventiOggi.length) righe.push("\uD83D\uDCC5 Oggi in agenda: " + eventiOggi.map(a => a.text + (a.time && a.time !== "\u2014" ? " alle " + a.time : "")).join(" \u00b7 "));
    const aperti = (m.todos || []).filter(t => !t.done);
    if (aperti.length) righe.push("\u2705 Task aperti: " + aperti.slice(0, 4).map(t => t.text).join(" \u00b7 ") + (aperti.length > 4 ? " (+" + (aperti.length - 4) + ")" : ""));
    const daFare = (m.habits || []).filter(h => h.lastDone !== oggiStr);
    if (daFare.length) righe.push("\uD83D\uDD01 Abitudini di oggi: " + daFare.slice(0, 4).map(h => h.text).join(" \u00b7 "));
    if (righe.length) {
      const ore = new Date().getHours();
      const saluto = ore < 12 ? "Buongiorno" : (ore < 18 ? "Buon pomeriggio" : "Buonasera");
      state.msgs.push({ role: "bot", text: saluto + ", Signor " + (m.facts.nome || OWNER) + ". Ecco il quadro di oggi:\n\n" + righe.join("\n") });
      m.ultimoBriefing = oggi;
      saveMem(m);
    }
  }

  state.screen = "chat";
  migraFotos();  // sposta le foto dal vecchio salvataggio al database del telefono
  render();
});
</script>
